[tools]
python = "3.11"
uv = "latest"

[tasks.setup]
description = "Install project dependencies"
run = "uv sync"

[tasks.check_db]
description = "Confirm the app can connect to DATABASE_URL"
run = "uv run lineage check-db"

[tasks.migrate]
description = "Apply the lineage schema"
run = "uv run lineage migrate"

[tasks.fetch]
description = "Pull the raw player-movement feed and store it"
run = "uv run lineage fetch --save-to exports/nba_player_movement.json"

[tasks.derive]
description = "Rebuild transaction/asset rows from raw payloads and data files"
run = "uv run lineage derive"

[tasks.validate]
description = "Check the derived data against graph invariants"
run = "uv run lineage validate"

[tasks.export]
description = "Write graph.json"
run = "uv run lineage export"

[tasks.render]
description = "Draw graph.svg from graph.json"
run = "uv run lineage render"

[tasks.load]
description = "Run fetch, derive, validate, export, render in sequence"
run = "uv run lineage load"

[tasks.test]
description = "Run the offline pytest suite"
run = "uv run pytest"
