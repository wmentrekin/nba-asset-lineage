[tools]
python = "3.11"
node = "22"
uv = "latest"

[tasks.setup]
description = "Install Python dependencies with UV"
run = "uv sync"

[tasks.db_check]
description = "Run a minimal database connectivity check using local .env"
run = "uv --cache-dir /tmp/uv-cache run python -m redesign_cli check-db"

[tasks.frontend_setup]
description = "Install frontend dependencies"
run = "cd frontend && npm install"

[tasks.frontend_dev]
description = "Run the Astro frontend in development mode"
run = "cd frontend && npm run dev"

[tasks.frontend_build]
description = "Build the Astro frontend"
run = "cd frontend && npm run build"

[tasks.frontend_check]
description = "Type-check the Astro frontend"
run = "cd frontend && npm run check"

[tasks.frontend_test]
description = "Run the frontend unit tests"
run = "cd frontend && npm run test"

[tasks.foundation_test]
description = "Run the offline foundation Python test suite"
run = "uv --cache-dir /tmp/uv-cache run pytest tests/foundation -q"
