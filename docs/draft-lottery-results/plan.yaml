# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "draft-lottery-results"
mode: "bounded-feature"
status: executed
owner_skill: work
based_on: "docs/draft-lottery-results/requirements.yaml"

objective: "Add source-backed Memphis-owned draft lottery result fixture loading for the existing foundation table."

approach:
  summary: "Mirror the guarded fixture-command pattern used by two-way status and draft pick resolution: add a curated fixture, read-only preview, dry-run/live load command, tests, and docs. Keep SQL schema and graph export unchanged."
  key_decisions:
    - "Use existing `foundation.draft_lottery_result` schema."
    - "Load only Memphis-owned lottery outcomes under current `team_code` semantics."
    - "Omit non-lottery years rather than inserting null-result rows."
    - "Exclude the 2020 Boston-from-Memphis outcome until schema supports owner/original-team distinction."
    - "Include the official 2026 lottery result because it is already known as of 2026-05-10."
    - "Keep lottery data contextual and out of graph export/frontend behavior for this pass."
    - "Require per-row source URLs, source labels, and retrieval dates before any fixture row can be loadable."
    - "Abort live load before writing on any validation block, including existing year/team rows with conflicting IDs."

contracts:
  interfaces:
    - "`preview-draft-lottery-results --team-code MEM [--fixture-path <path>]` returns fixture row status, proposed DB rows, existing matches, blocked rows, and warnings without writing."
    - "`load-draft-lottery-results --team-code MEM [--fixture-path <path>] --dry-run` returns the same guarded plan without writing."
    - "`load-draft-lottery-results --team-code MEM [--fixture-path <path>]` upserts only safe loadable fixture rows."
  schemas:
    - "No SQL schema change expected."
    - "Fixture has top-level metadata: `fixture_id=seed_v1`, `team_code`, `coverage_start_year`, `coverage_end_year`, `coverage_statement`, `source_set`, and `rows`."
    - "Fixture rows contain: `lottery_result_id`, `draft_year`, `lottery_date`, `team_code`, `lottery_position`, `result_pick_slot`, `pre_lottery_odds`, `source_urls`, `source_labels`, `retrieved_at`, `confidence`, `loadable`, and `notes`."
    - "Rows with `loadable=false` can document exclusions/caveats but are never written."
  validation_rules:
    - "All loadable rows must have `confidence=high`, at least one source URL, source labels, and a retrieval date."
    - "All loadable rows must match the CLI `--team-code`."
    - "Duplicate fixture `(draft_year, team_code)` pairs block preview/load."
    - "Existing DB rows with the same `(draft_year, team_code)` and a different `lottery_result_id` block live load before any write."
    - "Preview, dry-run, and live load share the same validation result; live load writes only if blocked rows are zero."
    - "Live load runs in one transaction and is idempotent."
  export_rules:
    - "Graph export must not read `foundation.draft_lottery_result` in this pass."
    - "Add a targeted non-consumption test and/or export comparison proving lottery rows do not alter base graph export."
  config_changes:
    - "Add `configs/data/memphis_draft_lottery_results_2016_2026.json`."
    - "Use that fixture as the default CLI fixture path."
    - "Update `configs/data/README.md`."

execution_batches:
  - id: "B1"
    goal: "Create fixture contract and preview/load implementation."
    tasks:
      - id: "T1"
        title: "Add fixture module and seed fixture"
        objective: "Create a draft lottery result fixture parser/validator and default Memphis seed fixture."
        owned_scope:
          - "configs/data/memphis_draft_lottery_results_2016_2026.json"
          - "src/foundation/draft_lottery_results.py"
          - "tests/foundation/test_draft_lottery_results.py"
        forbidden_scope:
          - "frontend layout code"
          - "SQL schema changes"
          - "graph export behavior"
        dependencies: []
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_draft_lottery_results.py"
      - id: "T2"
        title: "Add CLI preview/load commands"
        objective: "Wire preview, dry-run, and live guarded load through `src/redesign_cli.py` using checked-in code only, with shared validation and conflicting DB-row blocks."
        owned_scope:
          - "src/foundation/draft_lottery_results.py"
          - "src/redesign_cli.py"
          - "tests/foundation/test_draft_lottery_results.py"
        forbidden_scope:
          - "ad hoc DB write scripts"
          - "SQL schema changes"
        dependencies:
          - "T1"
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_draft_lottery_results.py"
          - ".venv/bin/python -m redesign_cli preview-draft-lottery-results --team-code MEM"
          - ".venv/bin/python -m redesign_cli load-draft-lottery-results --team-code MEM --dry-run"
  - id: "B2"
    goal: "Integrate audit/docs and run live load/export-neutral validation."
    tasks:
      - id: "T3"
        title: "Update audit/tests/docs"
        objective: "Make audit and docs reflect loaded contextual lottery rows and preserve graph-export non-goal."
        owned_scope:
          - "src/foundation/audit.py"
          - "tests/foundation/test_audit.py"
          - "tests/foundation/test_sql_contracts.py"
          - "configs/data/README.md"
          - "docs/foundation/README.md"
          - "docs/foundation/full-span-load-notes.md"
          - "docs/foundation/ingest-tables.md"
        forbidden_scope:
          - "frontend layout code"
        dependencies:
          - "T2"
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest"
          - ".venv/bin/python -m redesign_cli export-foundation-graph --output-path /private/tmp/foundation-graph-before-lottery.json"
          - ".venv/bin/python -m redesign_cli load-draft-lottery-results --team-code MEM --dry-run"
          - ".venv/bin/python -m redesign_cli load-draft-lottery-results --team-code MEM"
          - ".venv/bin/python -m redesign_cli audit-foundation-data"
          - ".venv/bin/python -m redesign_cli export-foundation-graph --output-path /private/tmp/foundation-graph-after-lottery.json"
          - "cmp /private/tmp/foundation-graph-before-lottery.json /private/tmp/foundation-graph-after-lottery.json"

ordering_notes:
  - "Do not run live load until preview and dry-run are clean."
  - "If `load-foundation-full-span --replace-existing` is run later, lottery enrichment must be rerun unless full-span is updated to include it."
  - "Graph export does not need regeneration for lottery-only rows unless the user wants current generated JSON refreshed for unrelated reasons."

risks:
  - "The current SQL table cannot distinguish pick owner from original team; 2020 is intentionally excluded."
  - "Provenance is richer in the fixture than in SQL; DB `notes` will be a summary, not full source data."
  - "2026 is current external data; if a source correction occurs, the fixture should be updated and reloaded."
  - "Audit could imply completeness if wording only checks nonzero rows; implementation must preserve contextual seed caveat."

open_questions: []

review:
  status: approved_for_checkpoint
  loop_count: 2
  notes:
    - "First review required stronger DB write safety, source pinning, audit caveat wording, explicit live-load validation, and export-neutral proof."
    - "Final review required a concrete graph-export compare step; plan now exports before live load, exports after live load, and compares the outputs."

checkpoint:
  required_before_execution: true
  status: approved
