artifact: plan
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: completed
owner_skill: work
based_on: "docs/foundation/data-gap-closure/requirements.yaml"

objective: "Close the remaining `recognized_provider_not_loaded = 368` bucket in one bounded pass by refining the corroboration contract so minimum truth and supplemental depth are not conflated."

approach:
  summary: "Treat this as a contract-and-audit closeout, not a new data-loading marathon. First revise the source-policy/audit model so fact types can express minimum truthful support separately from supplemental corroboration depth. Then update the event classification and summary output so already-loaded `nba_player_movement`, `team_official`, and `curated_fixture` evidence can satisfy the minimum contract where appropriate while any missing supplemental roles stay visible. Finish with one focused live audit and graph-baseline verification cycle."
  key_decisions:
    - "Do not reclassify `basketball_reference`-only events as `meets_minimum`."
    - "For `player_movement`, minimum truth is chronology spine plus at least one corroborating movement surface."
    - "For `pick_right_detail`, minimum truth remains loaded `secondary_pick_detail`; official confirmation is supplemental."
    - "Keep `planned_vs_loaded_rule` intact and continue to require an actual loaded matching source row before any provider role counts."
    - "Prefer new audit fields/notes for supplemental-depth residue over leaving `recognized_provider_not_loaded` as the active gap bucket."

contracts:
  interfaces:
    - "Revise the active source-policy model in `src/foundation/sources.py` to encode minimum-support versus supplemental-support semantics."
    - "Revise the corroboration report builder in `src/foundation/audit.py` so event classification uses the new contract."
    - "If needed, extend event and summary output with explicit supplemental-depth fields without breaking the current audit readers."
  schemas:
    - "No SQL migrations."
    - "No database writes are required unless verification reveals a truly unloaded blocker that contradicts discovery."
  config_changes:
    - "Update the active docs to reflect the new minimum-versus-supplemental corroboration contract."

execution_batches:
  - id: "B1"
    goal: "Refine the policy model."
    tasks:
      - id: "T1"
        title: "Encode minimum-support versus supplemental-support roles"
        objective: "Adjust the fact-type policy surface so `player_movement` and `pick_right_detail` can express the truthful minimum without treating all recognized target roles as mandatory for `meets_minimum`."
        owned_scope:
          - "src/foundation/sources.py"
          - "src/foundation/audit.py"
          - "tests/foundation/test_audit.py"
        forbidden_scope:
          - "SQL files"
          - "frontend files"
          - "database loaders unless later verification proves they are needed"
        dependencies: []
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_audit.py"
  - id: "B2"
    goal: "Preserve visibility into deeper corroboration depth."
    tasks:
      - id: "T2"
        title: "Expose supplemental residue without counting it as an open minimum-truth gap"
        objective: "Keep missing official or structured corroboration visible in event-level notes and, if needed, explicit fields/summary counts after the main bucket closes."
        owned_scope:
          - "src/foundation/audit.py"
          - "src/foundation/sources.py"
          - "tests/foundation/test_audit.py"
        forbidden_scope:
          - "non-audit foundation subsystems"
        dependencies:
          - "B1"
        parallelizable: false
  - id: "B3"
    goal: "Verify against the live data surface."
    tasks:
      - id: "T3"
        title: "Run the one-pass verification cycle"
        objective: "Run the focused test suite, then rerun the live read-only audit and graph-baseline check to confirm the entire `recognized_provider_not_loaded` bucket is closed without graph mutation."
        owned_scope:
          - "docs/foundation/data-gap-closure/status.yaml"
          - "docs/foundation/data-gap-closure/implementation-report.yaml"
          - "docs/foundation/full-span-load-notes.md"
        forbidden_scope:
          - "destructive DB operations"
          - "source-data curation unless a real blocker surfaces"
        dependencies:
          - "B1"
          - "B2"
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_audit.py"
          - ".venv/bin/pytest"
          - ".venv/bin/python -m redesign_cli audit-foundation-data"
          - ".venv/bin/python -m redesign_cli inspect-foundation-graph-baseline"

ordering_notes:
  - "If the revised contract still leaves a residue bucket after the live audit, stop after the first verification loop and report the exact blockers rather than broadening silently."
  - "Do not re-open official-source curation unless the live audit proves discovery was wrong and specific events still lack any loaded corroborating row."

risks:
  - "A contract change that is too broad could accidentally promote future non-Memphis or insufficiently corroborated events."
  - "If supplemental residue is only removed from the main status bucket and not surfaced elsewhere, the audit will become less useful."
  - "Tests currently assert the stricter semantics in several places and will need deliberate, explicit updates."
  - "Discovery could still be wrong for a small subset of the `69` team-official events if the matched official rows are too thin to count as truthful movement corroboration."

open_questions:
  - "Should the summary add a dedicated count for events that meet minimum but still lack supplemental corroboration?"

review:
  status: approved
  loop_count: 1
  notes:
    - "Discovery shows the live residue is mostly semantic, not raw-source scarcity."
    - "Subagent consensus is split only on whether the team-official surface should be treated as a policy issue; the live audit evidence supports closing it through the revised minimum contract because matching official rows already load and reconcile cleanly."

checkpoint:
  required_before_execution: true
  status: approved
