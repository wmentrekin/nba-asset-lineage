artifact: plan
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: draft
owner_skill: work
based_on: "docs/foundation/data-gap-closure/requirements.yaml"

objective: "Close the 2022-23 preseason/camp older-chronology cluster through the existing corroboration-only official-source path."

approach:
  summary: "Treat this as a fixture-first older-chronology pass. Add the missing curated `team_official` / `nba_official` source rows for the four 2022 preseason dates, preview them, dry-run them, and only then proceed to live load and audit verification."
  key_decisions:
    - "Bound the pass to the 8-event 2022-09-23 through 2022-10-14 preseason/camp cluster."
    - "Prefer source curation over loader or audit rewrites."
    - "Use the official 2022-23 Grizzlies playoff media guide transaction log as the likely backbone source for the four target dates, supplementing with the official Dakota Mathias article where it strengthens the `2022-10-14` row."
    - "Allow one or more curated `team_official` or `nba_official` transaction-page-style source records if that is the cleanest truthful representation."
    - "Keep all new source events `corroboration_only` and graph-safe."
    - "If fixture-only evidence does not reconcile cleanly in preview or dry-run, stop and re-scope instead of carrying matcher code changes in-band."

contracts:
  interfaces:
    - "`preview-official-release-sources` must show the newly curated rows before any write."
    - "`load-official-release-sources --dry-run` must show the exact source_record/source_event candidates for the 8 targeted events."
    - "`load-official-release-sources --execute` remains the only write path."
    - "`audit-foundation-data` is the truth surface for whether the 8 gaps are actually closed."
  schemas:
    - "No SQL migrations."
    - "No new tables or columns."
    - "Reuse `foundation.source_record` and `foundation.source_event` through the existing official-source loader."
  config_changes:
    - "Update `configs/data/memphis_official_release_sources_seed_v1.json`."
    - "Update active gap docs after the live load and audit."

execution_batches:
  - id: "B1"
    goal: "Curate the missing 2022 preseason/camp source rows."
    tasks:
      - id: "T1"
        title: "Add the 2022-09-23 through 2022-10-14 source records"
        objective: "Extend the official-source fixture with the smallest truthful set of new source rows needed to represent the 8 target signings and waivers."
        owned_scope:
          - "configs/data/memphis_official_release_sources_seed_v1.json"
          - "docs/foundation/full-span-load-notes.md"
        forbidden_scope:
          - "SQL files"
          - "frontend files"
          - "canonical generation code"
        dependencies: []
        parallelizable: false
        expected_validation:
          - ".venv/bin/python -m redesign_cli preview-official-release-sources"
          - ".venv/bin/python -m redesign_cli load-official-release-sources --dry-run"
  - id: "B2"
    goal: "Load the new corroborating rows and verify the cluster closes."
    tasks:
      - id: "T2"
        title: "Load and audit the 2022 cluster closeout"
        objective: "Capture the exact 8 pre-load target rows, write the curated source rows, rerun the read-only audit, and confirm those exact rows are no longer `bref_only`."
        owned_scope:
          - "docs/foundation/data-gap-closure/implementation-report.yaml"
          - "docs/foundation/data-gap-closure/status.yaml"
          - "docs/foundation/full-span-load-notes.md"
        forbidden_scope:
          - "destructive DB operations"
          - "canonical rebuild logic"
          - "frontend rendering files"
        dependencies:
          - "B1"
        parallelizable: false
        expected_validation:
          - "Targeted read-only baseline query for the 8 exact player/date/type rows"
          - ".venv/bin/python -m redesign_cli load-official-release-sources --execute"
          - ".venv/bin/python -m redesign_cli audit-foundation-data"
          - ".venv/bin/python -m redesign_cli inspect-foundation-graph-baseline"
          - "Targeted read-only post-load query confirming the same 8 rows no longer land as `bref_only`"

ordering_notes:
  - "Try the fixture-only path first."
  - "If preview or dry-run reveals a concrete matching risk, stop and re-scope instead of patching matcher code in this pass."
  - "Verification is complete only when the post-load audit explicitly clears the 8 exact targeted events."

risks:
  - "The 2022 cluster may require more than one curated source record if the available source text naturally splits by date."
  - "Some source basis may still rely on `nba_official` transaction-page fallback rather than dedicated Grizzlies articles."
  - "If fixture-only evidence does not reconcile cleanly, the pass will stop without implementation rather than silently broadening scope."

open_questions:
  - "Is one curated record per date the cleanest truthful representation, or can some dates be grouped under a smaller number of source records without hurting reconciliation clarity?"

review:
  status: approved
  loop_count: 2
  notes:
    - "Reviewer required removing the in-band matcher/code-fix batch from the default execution path."
    - "Reviewer required making the `team_official` / `nba_official` evidence model explicit."
    - "Reviewer required exact pre-load and post-load verification targets for the 8 events."
    - "Reviewer required checkpoint state to remain pending before execution."
    - "Reviewer approved the revised plan with one residual risk: execution may still stop if truthful `team_official` / `nba_official` evidence cannot be found for one or more events."

checkpoint:
  required_before_execution: true
  status: pending
