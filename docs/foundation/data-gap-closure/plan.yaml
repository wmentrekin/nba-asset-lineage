artifact: plan
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: completed
owner_skill: work
based_on: "docs/foundation/data-gap-closure/requirements.yaml"

objective: "Close the remaining `missing_required_evidence = 38` draft/pick bucket through one bulk curated `secondary_pick_detail` load and one verification cycle."

approach:
  summary: "Treat the remaining `missing_required_evidence` bucket as one draft-only closeout. First add a small curated draft-pick-detail load path that emits `corroboration_only` `curated_fixture` source rows from the existing draft selection truth surface. Then extend audit reconciliation so exact same-day draft corroboration rows can satisfy duplicate canonical draft events for the same player/selection. Finish with one preview or dry-run, one live load, and one audit/graph verification cycle."
  key_decisions:
    - "Keep the existing `corroboration_only` path and do not alter canonical graph derivation."
    - "Use `curated_fixture` as the `secondary_pick_detail` provider role for this pass."
    - "Build the bulk payload around the unique Memphis draft selections behind the 38 canonical rows, not around each duplicate canonical event."
    - "Treat promotion from `missing_required_evidence` to `recognized_provider_not_loaded` as acceptable unless an event already has official confirmation loaded."

contracts:
  interfaces:
    - "Add a read-only preview and guarded load path for curated draft-pick-detail corroboration rows."
    - "The new load path must write only `foundation.source_record` and `foundation.source_event` rows."
    - "The final live path remains one combined guarded execute run."
    - "`audit-foundation-data` remains the truth surface for bulk closure success."
  schemas:
    - "No SQL migrations."
    - "No new database tables or columns."
    - "Reuse `foundation.source_record` and `foundation.source_event` only."
  config_changes:
    - "Either introduce a new checked-in draft-pick-detail fixture or generate the payload directly from the existing draft selection tables with a clearly documented source basis."
    - "Update active gap docs after aggregate load and audit."

execution_batches:
  - id: "B1"
    goal: "Prepare the draft closeout load path."
    tasks:
      - id: "T1"
        title: "Add curated draft-pick-detail preview/load support"
        objective: "Create the smallest checked-in path that can emit `corroboration_only` `curated_fixture` source rows for the Memphis draft selections behind the 38 missing-required canonical events."
        owned_scope:
          - "src/foundation/"
          - "src/redesign_cli.py"
          - "tests/foundation/"
        forbidden_scope:
          - "SQL files"
          - "frontend files"
          - "canonical generation code outside draft-only audit reconciliation"
        dependencies: []
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_live_sources.py tests/foundation/test_audit.py"
          - "preview command for the curated draft-pick-detail payload"
  - id: "B2"
    goal: "Teach the audit to consume the new draft evidence correctly."
    tasks:
      - id: "T2"
        title: "Add exact draft reconciliation support"
        objective: "Extend audit reconciliation so exact same-day draft corroboration rows can satisfy the current canonical draft rows, including duplicate same-day rows for the same player/selection and the GG/Gregory alias case."
        owned_scope:
          - "src/foundation/audit.py"
          - "tests/foundation/test_audit.py"
        forbidden_scope:
          - "non-draft player-movement reconciliation logic"
        dependencies:
          - "B1"
        parallelizable: false
  - id: "B3"
    goal: "Validate the full draft evidence payload before writing."
    tasks:
      - id: "T3"
        title: "Run one preview and dry-run"
        objective: "Validate the draft evidence payload and fail fast on malformed rows, duplicate IDs, or obvious matching misses before any live load."
        owned_scope:
          - "docs/foundation/data-gap-closure/status.yaml"
        forbidden_scope:
          - "live DB writes"
        dependencies:
          - "B1"
          - "B2"
        parallelizable: false
        expected_validation:
          - "preview command"
          - "dry-run command"
          - "targeted diff of the 38 canonical draft events"
  - id: "B4"
    goal: "Execute and verify the closeout."
    tasks:
      - id: "T4"
        title: "Run one live load, audit, and graph-baseline verification"
        objective: "Write the draft corroboration payload once, verify graph invariance, and confirm the remaining `missing_required_evidence` residue is either zero or explicitly blocked."
        owned_scope:
          - "docs/foundation/data-gap-closure/implementation-report.yaml"
          - "docs/foundation/data-gap-closure/status.yaml"
          - "docs/foundation/full-span-load-notes.md"
        forbidden_scope:
          - "destructive DB operations"
          - "canonical rebuild logic"
          - "frontend rendering files"
        dependencies:
          - "B3"
        parallelizable: false
        expected_validation:
          - "live draft-pick-detail execute command"
          - ".venv/bin/python -m redesign_cli audit-foundation-data"
          - ".venv/bin/python -m redesign_cli inspect-foundation-graph-baseline"
          - "post-load event-level diff for the 38 draft canonical IDs showing `missing_required_evidence=0` or an explicit blocked remainder"

ordering_notes:
  - "Do not broaden this into prior-ownership lineage or future-pick replay work inside the same pass."
  - "Keep the closure surface draft-only and exact-match oriented."
  - "If one or more draft rows still fail after the new load path, stop after the first verification loop and report the explicit blockers."

risks:
  - "A generated `curated_fixture` payload could look self-referential if its source basis is not documented clearly enough."
  - "Duplicate same-day draft canonical rows may require a narrow new reconciliation rule rather than the current unique-candidate rule."
  - "The GG/Gregory Jackson alias mismatch can leave one selection unresolved if the matcher stays too literal."
  - "If the finish line is silently reinterpreted from `missing_required_evidence` to `meets_minimum`, the scope expands materially."

open_questions:
  - "Should the new load path be backed by a checked-in fixture file or by deterministic generation from the live draft-selection truth surface?"

review:
  status: approved
  loop_count: 1
  notes:
    - "Planning basis is now narrower and cleaner than the earlier player-movement bulk pass: one fact type, one required role, one closure surface."

checkpoint:
  required_before_execution: true
  status: approved
