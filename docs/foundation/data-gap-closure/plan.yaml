artifact: plan
feature: "foundation/data-gap-closure"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/foundation/data-gap-closure/requirements.yaml"

objective: "Close the remaining older player-movement `bref_only` residue through one bulk, fragment-authored, combined-load initiative."

approach:
  summary: "Treat the remaining `bref_only` residue as one coordinated closeout. First add a minimal fragment-aware loader surface. Then curate the remaining source evidence in parallel through disjoint fragment files. Finish with one aggregate preview, one aggregate dry-run, one live load, and one audit/graph verification cycle."
  key_decisions:
    - "Use the current committed state as the baseline and do not continue with another single-cluster pass."
    - "Define the finish line for this initiative as `bref_only -> 0` or a fully enumerated blocked residue."
    - "Use fragment-based authoring for parallelism, but keep one serialized final load."
    - "Shard work primarily by season/source-family so each worker owns disjoint `source_record_id` space."
    - "Treat promotion from `bref_only` to `recognized_provider_not_loaded` as acceptable for this initiative unless the user explicitly asks for `meets_minimum` closure."

contracts:
  interfaces:
    - "The official-source preview/load workflow must support one base `--fixture-path` plus one fragment directory `--fixture-fragment-dir`, aggregating all `*.json` fragments in lexicographic order before validation and load."
    - "The aggregate workflow must fail on duplicate `source_record_id` or duplicate explicit `source_event_id`."
    - "The final live path remains one combined `load-official-release-sources --execute` run."
    - "`audit-foundation-data` remains the truth surface for bulk closure success."
    - "A checked-in target manifest must exist before execution and must enumerate every current `bref_only` canonical event with shard assignment and status."
  schemas:
    - "No SQL migrations."
    - "No new database tables or columns."
    - "Reuse `foundation.source_record` and `foundation.source_event` through the existing official-source loader."
  config_changes:
    - "Add `configs/data/memphis_official_release_fragments/` for new official-source curation batches."
    - "Retain compatibility with the existing monolithic seed file by using it as the base `--fixture-path` while new fragments are loaded from `--fixture-fragment-dir`."
    - "Update active gap docs after aggregate load and audit."

execution_batches:
  - id: "B1"
    goal: "Prepare a safe bulk authoring surface."
    tasks:
      - id: "T1"
        title: "Add fragment-aware aggregation to the official-source preview/load path"
        objective: "Allow bulk curation to happen in disjoint fixture fragments while preserving one combined preview/dry-run/execute path."
        owned_scope:
          - "src/foundation/live_sources.py"
          - "src/redesign_cli.py"
          - "tests/foundation/test_live_sources.py"
          - "configs/data/"
        forbidden_scope:
          - "SQL files"
          - "frontend files"
          - "canonical generation code"
        dependencies: []
        parallelizable: false
        expected_validation:
          - ".venv/bin/pytest tests/foundation/test_live_sources.py"
          - "aggregate preview command against the current base fixture plus an empty or sample fragment set"
  - id: "B2"
    goal: "Curate the remaining residue in parallel."
    tasks:
      - id: "T2A"
        title: "Curate the 2016-2018 camp/preseason signing shard"
        objective: "Add fragment-owned official rows for the 2016-2018 signings using transaction logs, media guides, or direct releases."
        owned_scope:
          - "configs/data/memphis_official_release_fragments/"
        forbidden_scope:
          - "existing fragment files owned by other workers"
          - "Python modules outside the assigned fragment-support batch"
        dependencies:
          - "B1"
        parallelizable: true
      - id: "T2B"
        title: "Curate the 2019 free-agency / preseason / trade shard"
        objective: "Add fragment-owned official rows for the remaining 2019 signings and trade clusters."
        owned_scope:
          - "configs/data/memphis_official_release_fragments/"
        forbidden_scope:
          - "existing fragment files owned by other workers"
          - "Python modules outside the assigned fragment-support batch"
        dependencies:
          - "B1"
        parallelizable: true
      - id: "T2C"
        title: "Curate the 2020 offseason / camp shard"
        objective: "Add fragment-owned official rows for the remaining 2020 signings, waiver, and extension-style rows."
        owned_scope:
          - "configs/data/memphis_official_release_fragments/"
        forbidden_scope:
          - "existing fragment files owned by other workers"
          - "Python modules outside the assigned fragment-support batch"
        dependencies:
          - "B1"
        parallelizable: true
      - id: "T2D"
        title: "Curate the 2021 offseason / camp / trade shard"
        objective: "Add fragment-owned official rows for the remaining 2021 signings, waiver, and trade cluster."
        owned_scope:
          - "configs/data/memphis_official_release_fragments/"
        forbidden_scope:
          - "existing fragment files owned by other workers"
          - "Python modules outside the assigned fragment-support batch"
        dependencies:
          - "B1"
        parallelizable: true
  - id: "B3"
    goal: "Validate the full bulk payload before writing."
    tasks:
      - id: "T3"
        title: "Run one aggregate preview and dry-run"
        objective: "Validate the combined fragment set and fail fast on duplicate IDs, malformed rows, or obvious matching issues before any live load."
        owned_scope:
          - "docs/foundation/data-gap-closure/status.yaml"
        forbidden_scope:
          - "live DB writes"
        dependencies:
          - "B2"
        parallelizable: false
        expected_validation:
          - "aggregate preview command"
          - "aggregate dry-run command"
          - "targeted inventory diff against `docs/foundation/data-gap-closure/target-manifest.yaml`"
  - id: "B4"
    goal: "Execute and verify the closeout."
    tasks:
      - id: "T4"
        title: "Run one live load, audit, and graph-baseline verification"
        objective: "Write the aggregate corroboration payload once, verify graph invariance, and confirm the remaining `bref_only` residue is either zero or explicitly blocked."
        owned_scope:
          - "docs/foundation/data-gap-closure/implementation-report.yaml"
          - "docs/foundation/data-gap-closure/status.yaml"
          - "docs/foundation/full-span-load-notes.md"
        forbidden_scope:
          - "destructive DB operations"
          - "canonical rebuild logic"
          - "frontend rendering files"
        dependencies:
          - "B3"
        parallelizable: false
        expected_validation:
          - "live aggregate `load-official-release-sources --execute`"
          - ".venv/bin/python -m redesign_cli audit-foundation-data"
          - ".venv/bin/python -m redesign_cli inspect-foundation-graph-baseline"
          - "post-load event-level diff for the manifest canonical IDs showing `bref_only=0` or an explicit blocked remainder"

ordering_notes:
  - "Do not let multiple workers edit one shared monolithic fixture file."
  - "Parallelism applies to authoring and source curation, not to live database execute."
  - "If discovery surfaces structurally blocked rows, isolate them in the target manifest before the final preview/dry-run instead of letting them hide inside the batch."

risks:
  - "Some 2020 extension-style or assetless BRef rows may not map cleanly to team-official player-movement evidence."
  - "Trade clusters may require grouped source rows and careful participant-direction fidelity."
  - "Introducing fragment-aware aggregation is small but real infrastructure work; it must stay minimal."
  - "If the finish line is silently reinterpreted from `bref_only` to `meets_minimum`, the initiative scope will expand materially."

open_questions:
  - "Do any remaining 2020 extension-style rows need to be carved out as a separate blocker batch before execution?"

review:
  status: approved
  loop_count: 1
  notes:
    - "Reviewer accepted the bulk-pass scope after requiring a first-class target manifest, a locked fragment interface, and a cleaned-up checkpoint state."
    - "The biggest residual risk remains the 2020 extension-style assetless rows, which are now isolated explicitly in the manifest."

checkpoint:
  required_before_execution: true
  status: pending
