      status: "open"
      note: "Still requires source-by-source curation beyond this pass."
    - id: "HP3"
      gap: "Future-pick fallback and conditional branch semantics remain partially documentation-only."
      status: "deferred"
      note: "Fallback facts are source-backed but intentionally non-loadable until conditional branch modeling exists."
    - id: "HP4"
      gap: "One future-pick obligation has incomplete owner semantics."
      status: "closed"
      note: "ORL 2028 first sent out in Coward trade now resolves to owner_team_code POR; live audit reports zero UNKNOWN owner rows."
