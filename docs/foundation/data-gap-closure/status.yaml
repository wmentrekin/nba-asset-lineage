      gap: "Transaction source coverage is mostly Basketball-Reference; official/corroborating source coverage is not systematic."
      status: "closed"
      note: "Live audit now shows loaded source systems `basketball_reference` and `nba_player_movement`, and source_coverage_report has no remaining system-level coverage gaps."
    - id: "HP6"
      gap: "Draft-night pick ownership lineage is linked to selected slot truth but not full prior ownership chain."
      status: "deferred"
      note: "Audit now reports this explicitly as a deferred limitation."
  remaining_data_layer:
