      gap: "Contract semantics beyond standard/two-way are thin."
      status: "open"
    - id: "R5"
      gap: "Player identity enrichment is incomplete; NBA Stats reference data is not live-loaded."
      status: "open"
    - id: "R6"
      gap: "Draft lottery rows are contextual seed data and are not consumed by the base graph export."
      status: "open"
    - id: "R7"
      gap: "Lottery coverage is Memphis-perspective only."
      status: "open"
