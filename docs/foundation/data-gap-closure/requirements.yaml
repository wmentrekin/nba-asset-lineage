artifact: requirements
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: completed
owner_skill: work

summary:
  problem: "The live audit now reports `recognized_provider_not_loaded = 368` after both `bref_only` and `missing_required_evidence` were closed to zero. The residue is concentrated in three already-loaded evidence surfaces: `basketball_reference|nba_player_movement` (261), `basketball_reference|team_official` (69), and `basketball_reference|curated_fixture` (38)."
  motivation: "This is now the largest remaining live data-foundation gap. Discovery shows most of it is not missing raw evidence; it is a corroboration-contract problem where supplemental provider depth is still being counted as an open gap even when the minimum truthful support path is already loaded."
  requested_outcome: "Close the entire `recognized_provider_not_loaded` bucket in one bounded pass by separating minimum-required corroboration from supplemental corroboration, preserving visibility into missing supplemental depth without continuing to count it as an open minimum-truth gap."

goals:
  - "Reduce the live `recognized_provider_not_loaded` count from 368 to 0 in one pass if the existing loaded evidence surfaces already satisfy the truthful minimum contract."
  - "Keep the closure truthful: no `basketball_reference`-only event may be promoted by this pass."
  - "Model player-movement corroboration so that loaded chronology plus one corroborating movement surface is sufficient for minimum truth, while still exposing any missing supplemental corroboration."
  - "Model pick-right-detail corroboration so that loaded `secondary_pick_detail` satisfies the minimum, while still exposing missing official draft confirmation as supplemental depth rather than an open minimum-truth gap."
  - "Preserve the existing `planned_vs_loaded_rule`: recognized providers still only count when a matching loaded row exists."
  - "Finish with one focused verification cycle against the live read-only audit and graph-baseline check."

non_goals:
  - "Do not re-open `bref_only` or `missing_required_evidence` work that is already closed."
  - "Do not weaken the contract so that `basketball_reference` alone can satisfy player-movement or pick-detail truth."
  - "Do not broaden this pass into roster checkpoints, daily roster state, two-way completeness, contract semantics, or future-pick lineage."
  - "Do not perform destructive database operations."
  - "Do not silently hide missing supplemental corroboration; it must remain inspectable in the audit output."

constraints:
  technical:
    - "Any implementation must preserve canonical graph invariance."
    - "If no new source rows are needed, this pass should remain code-only plus read-only verification."
    - "If the audit schema changes, it should remain backward-readable enough for the current docs and tests to track the transition cleanly."
    - "The corroboration report must continue to distinguish required-role failure from optional-depth residue."
  product:
    - "Minimum truthful graph output remains the governing standard."
    - "Memphis-only scope remains the target."
    - "The result should make the remaining gap list smaller and clearer, not just move counts into a renamed bucket."
  process:
    - "Use `$work` orchestration and stop for the required pre-execution checkpoint before implementation begins."
    - "Keep `docs/foundation/data-gap-closure/status.yaml` current."

assumptions:
  - "The `261` `basketball_reference|nba_player_movement` events already have loaded structured player-movement evidence and are being held open only because official confirmation is still treated as required for `meets_minimum`."
  - "The `69` `basketball_reference|team_official` events already have loaded official confirmation and are being held open only because structured movement is still treated as required for `meets_minimum`."
  - "The `38` `basketball_reference|curated_fixture` draft events already have loaded `secondary_pick_detail` evidence and are being held open only because official confirmation is still treated as required for `meets_minimum`."
  - "A truthful minimum contract for `player_movement` can be expressed as chronology spine plus at least one corroborating movement surface (`structured_player_movement` or `official_confirmation`)."

repo_context:
  relevant_paths:
    - "src/foundation/sources.py"
    - "src/foundation/audit.py"
    - "tests/foundation/test_audit.py"
    - "docs/foundation/data-gap-closure/status.yaml"
    - "docs/foundation/data-gap-closure/implementation-report.yaml"
    - "docs/foundation/full-span-load-notes.md"
  systems_in_scope:
    - "source policy semantics"
    - "foundation audit corroboration classification"
    - "audit summary/report output"
  prior_artifacts:
    - "docs/foundation/data-gap-closure/implementation-report.yaml"
    - "docs/foundation/full-span-load-notes.md"

research:
  repo_findings:
    - "The live residue splits cleanly into `261` `basketball_reference|nba_player_movement`, `69` `basketball_reference|team_official`, and `38` `basketball_reference|curated_fixture` events."
    - "Current `player_movement` policy text already says movement details are corroborated by structured movement data `or` official text."
    - "Current audit classification promotes an event to `meets_minimum` only when every recognized provider role is loaded, not when the minimum truthful support path is loaded."
    - "The `69` `team_official` events already reconcile to loaded corroboration-only official rows with no participant mismatch detected."
    - "The `38` draft rows are already out of `missing_required_evidence`; the remaining residue is supplemental official confirmation, not the required `secondary_pick_detail` role."
  platform_findings: []

acceptance_criteria:
  - "The implementation explicitly separates minimum required corroboration from supplemental corroboration depth in the active source-policy/audit contract."
  - "A post-change live read-only audit reduces `recognized_provider_not_loaded` from 368 to 0, or any surviving rows are explicitly documented as truthful blockers."
  - "No event with loaded source systems equal to only `basketball_reference` is promoted by this pass."
  - "The audit still surfaces missing supplemental corroboration in notes or dedicated fields after the `recognized_provider_not_loaded` bucket is closed."
  - "Canonical counts and graph checksum remain unchanged."
  - "Tests cover all three live closure surfaces: `basketball_reference|nba_player_movement`, `basketball_reference|team_official`, and `basketball_reference|curated_fixture`."

open_questions:
  - "Should supplemental corroboration residue remain note-only, or should the audit add an explicit `missing_supplemental_roles` field and summary metric so the depth gap remains measurable after the bucket closes?"

ready_for_planning: true
planning_blockers: []
