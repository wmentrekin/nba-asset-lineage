artifact: requirements
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: completed
owner_skill: work

summary:
  problem: "The live audit now reports `missing_required_evidence = 38` after `bref_only` was closed to zero. Every remaining `missing_required_evidence` row is a Memphis draft canonical event missing only the `secondary_pick_detail` provider role."
  motivation: "This is now the largest remaining truth-surface blocker before the more structural gaps. If the draft/pick bucket closes cleanly, the remaining work becomes mostly `recognized_provider_not_loaded` coverage and broader architectural enrichment."
  requested_outcome: "Close the entire 38-row draft/pick `missing_required_evidence` bucket in one pass through a truthful `secondary_pick_detail` load path and one verification cycle."

goals:
  - "Reduce the live `missing_required_evidence` count from 38 to 0 if truthful `secondary_pick_detail` evidence can be loaded for the remaining Memphis draft events."
  - "Treat the entire bucket as one draft-only closeout, not as separate year-by-year residue slices."
  - "Introduce the smallest safe checked-in load path needed to attach `curated_fixture` or equivalent `secondary_pick_detail` evidence to the existing draft canonical events."
  - "Extend audit-time reconciliation only as far as needed to let draft corroboration rows satisfy duplicate same-day draft canonical events for the same player/selection."
  - "Keep all new corroborating rows on the existing `corroboration_only` path so canonical truth and graph export remain invariant."
  - "Finish with one preview/dry-run, one live execute, one live audit, and one graph-baseline check."

non_goals:
  - "Do not widen this pass into the 330 `recognized_provider_not_loaded` events beyond what naturally changes after the required draft role is loaded."
  - "Do not widen this pass into official roster checkpoints, daily roster state, two-way completeness, or contract-semantics work."
  - "Do not change canonical derivation rules, transition generation rules, or frontend rendering behavior beyond draft-only audit reconciliation."
  - "Do not perform destructive database operations."
  - "Do not promise promotion of all touched events to `meets_minimum`; this pass is about eliminating `missing_required_evidence` for draft events."

constraints:
  technical:
    - "All DB writes must continue to go through checked-in Python/CLI commands."
    - "Curated corroboration rows must remain `normalized_payload.corroboration_only = true`."
    - "No SQL migrations or new tables should be required for this pass."
    - "Any new source rows must load through `foundation.source_record` and `foundation.source_event` only."
    - "Draft audit reconciliation must stay exact and conservative; it should not create broad fuzzy matching across different players or selections."
  product:
    - "Truthfulness is more important than getting to zero by force. If a draft event cannot be backed cleanly by the chosen `secondary_pick_detail` basis, it must remain explicit."
    - "Memphis-only scope remains the target."
    - "For this pass, 'gap closed' means 'no longer `missing_required_evidence`', not necessarily `meets_minimum`."
  process:
    - "Use `$work` orchestration and stop for the required pre-execution checkpoint before implementation begins."
    - "Keep `docs/foundation/data-gap-closure/status.yaml` current."

assumptions:
  - "The remaining 38 canonical draft rows collapse to roughly 20 actual draft selections plus a small alias/duplicate layer."
  - "A curated draft-pick-detail load path is acceptable for `secondary_pick_detail` because that provider role explicitly recognizes `curated_fixture`."
  - "Most duplicate draft canonical events come from multiple source surfaces describing the same Memphis selection on the same date."

repo_context:
  relevant_paths:
    - "configs/data/memphis_draft_pick_resolution_2016_2025.json"
    - "src/foundation/audit.py"
    - "src/foundation/live_sources.py"
    - "src/redesign_cli.py"
    - "tests/foundation/test_audit.py"
    - "tests/foundation/test_live_sources.py"
    - "docs/foundation/full-span-load-notes.md"
  systems_in_scope:
    - "curated draft/pick corroboration loading"
    - "foundation audit corroboration report"
    - "draft selection source data"
  prior_artifacts:
    - "docs/foundation/data-gap-closure/implementation-report.yaml"
    - "docs/foundation/full-span-load-notes.md"

research:
  repo_findings:
    - "The live `missing_required_evidence` residue is exactly 38 canonical events."
    - "Every one of those events is `event_type=draft` and `fact_type=pick_right_detail`."
    - "Every one of those events is missing only the `secondary_pick_detail` role; no other required roles are missing in this bucket."
    - "The residue spans draft years 2016, 2018, 2019, 2020, 2021, 2022, 2023, 2024, and 2025."
    - "The current audit matcher does not reconcile `draft` corroboration candidates yet; it only has exact logic for trade/waiver/signing and grouped/near-date special cases."
    - "There is at least one alias trap inside the residue: `GG Jackson II` versus `Gregory Jackson II`."
  platform_findings: []

acceptance_criteria:
  - "The exact live 38-event draft inventory is captured in the docs before execution."
  - "The implementation introduces a checked-in load path for `secondary_pick_detail` evidence without adding new tables."
  - "The audit can reconcile draft corroboration rows to the existing canonical draft events, including duplicate same-day draft rows for the same selection."
  - "One preview or dry-run shows the full draft evidence payload before any live write."
  - "One live execute succeeds without changing canonical counts or the graph checksum."
  - "A post-load audit reduces `missing_required_evidence` from 38 to 0, or every surviving row is explicitly documented with a blocker."
  - "Docs clearly record that this closes the required-role bucket, not the deeper prior-ownership-lineage problem."

open_questions:
  - "Should the draft corroboration payload be generated directly from live `draft_selection` rows, or should it be backed by a new checked-in fixture file for long-term editability?"

ready_for_planning: true
planning_blockers: []
