artifact: requirements
feature: "foundation/data-gap-closure"
mode: "bounded-feature"
status: draft
owner_skill: work

summary:
  problem: "After the recent 2023 closeout, the live audit still reports 52 older `bref_only` player-movement events. The highest-yield remaining subset is the 2022-23 preseason/camp cluster: 8 simple named signings/waivers across 4 dates."
  motivation: "Closing a larger, low-complexity older cluster continues shrinking the chronology residue without jumping into trades, unnamed moves, or draft/pick evidence."
  requested_outcome: "Load enough curated `team_official` and/or `nba_official` corroborating source evidence so the 8-event 2022-23 preseason/camp cluster no longer appears as `bref_only` in the foundation audit."

goals:
  - "Close the 2022-09-23 Jacob Gilyard and Justin Bean signing gaps."
  - "Close the 2022-10-10 Matthew Hurt and Sean McDermott signing gaps."
  - "Close the 2022-10-13 EJ Onu and Romeo Weems signing gaps plus the Matthew Hurt waiver gap."
  - "Close the 2022-10-14 Dakota Mathias signing gap."
  - "Keep the change on the existing corroboration-only source path so canonical events, transitions, and graph export truth do not change."
  - "Prefer fixture-first source additions and stop to re-scope if fixture-only evidence does not reconcile cleanly."

non_goals:
  - "Do not widen this pass into the remaining older 44 `bref_only` events outside this 2022 cluster."
  - "Do not address the older trade-heavy 2019-2021 residue in this pass."
  - "Do not address `recognized_provider_not_loaded` or `missing_required_evidence` outside this cluster."
  - "Do not change canonical derivation, transition generation, or frontend rendering."
  - "Do not introduce new source systems or SQL schema changes."
  - "Do not perform destructive database operations."

constraints:
  technical:
    - "All DB writes must continue to go through checked-in Python/CLI commands."
    - "Curated `team_official` / `nba_official` corroboration rows must remain `normalized_payload.corroboration_only = true`."
    - "For signings and waivers, audit reconciliation is per event/player; grouped source records may contain multiple events, but each player move still needs its own `source_event` row."
    - "The official-source fixture and loader must stay compatible with existing `team_official` / `nba_official` source types."
    - "If existing fixture records are edited instead of adding new records, the loader replaces the full `source_record_id` payload as a unit."
  product:
    - "Truthfulness is more important than forcing a close. If a source cannot be justified with `team_official` or `nba_official` evidence, leave the event unresolved and call it out."
    - "Memphis-only scope remains the target."
  process:
    - "Use `$work` orchestration and stop for the pre-execution checkpoint before any edits or live loads."
    - "Use subagents for discovery, plan review, execution, and verification."
    - "Keep `docs/foundation/data-gap-closure/status.yaml` current."

assumptions:
  - "This cluster is likely closable with a small number of curated `team_official` and/or `nba_official` transaction-page or team-release source records."
  - "The audit will accept event dates that differ from source publication dates when curated transaction-page rows carry the correct historical `event_date`."
  - "This slice does not appear to require name-matching changes because all eight events already have clean player identities."

repo_context:
  relevant_paths:
    - "configs/data/memphis_official_release_sources_seed_v1.json"
    - "src/foundation/live_sources.py"
    - "src/foundation/audit.py"
    - "src/redesign_cli.py"
    - "tests/foundation/test_live_sources.py"
    - "tests/foundation/test_audit.py"
    - "docs/foundation/full-span-load-notes.md"
    - "docs/foundation/data-gap-closure/status.yaml"
  systems_in_scope:
    - "official-source fixture curation"
    - "official-source preview/load CLI"
    - "foundation audit corroboration report"
  prior_artifacts:
    - "docs/foundation/data-gap-closure/implementation-report.yaml"
    - "docs/foundation/full-span-load-notes.md"

research:
  repo_findings:
    - "The remaining older chronology residue is concentrated in signings and waivers, with the 2022-23 preseason/camp cluster offering 8 low-complexity named events."
    - "The current official-source fixture already supports one article or transaction page carrying multiple event rows, which fits this slice well."
    - "The current audit logic reconciles signings and waivers per event/player rather than as one grouped multi-event match, so each player move must have its own event row."
    - "The current residue appears to be a coverage gap, not a conflict or reconciliation bug."
  platform_findings:
    - "The official 2022-23 Grizzlies playoff media guide transaction log explicitly lists the target `9/23`, `10/10`, `10/13`, and `10/14` moves on one official team document."
    - "The official Dakota Mathias Grizzlies article directly covers the `2022-10-14` Dakota Mathias signing plus the EJ Onu and Romeo Weems waivers."
    - "The likely source strategy is the same proven path used in recent passes: curated `team_official` or `nba_official` locators, with event dates carried in corroboration-only rows."
    - "This slice is lower risk than 2019-2021 because it avoids unnamed signings and trade-heavy dates."

acceptance_criteria:
  - "The official-source fixture contains curated corroborating entries that cover the 8 target events."
  - "The official-source preview and dry-run output show the new source rows with the expected event dates, event types, and player names."
  - "A live `load-official-release-sources --execute` run succeeds without changing canonical/graph baseline counts or checksum."
  - "Pre-load verification captures the exact 8 target rows by date, event type, and player so post-load verification can confirm those exact rows clear."
  - "A post-load `audit-foundation-data` run no longer lists these 8 events as `bref_only`."
  - "Total `bref_only` count falls by at least 8 from the current baseline of 52, unless a named source-quality or matching issue is discovered and documented."
  - "If fixture-only evidence does not reconcile cleanly, the pass stops and re-scopes instead of carrying code changes in-band."
  - "Docs clearly record which locator(s) were used for the 2022-09-23 through 2022-10-14 cluster."

open_questions:
  - "Does this cluster resolve cleanly from one or two curated transaction-page records, or does it need more granular record splits by date?"

ready_for_planning: true
planning_blockers: []
