review_summary:
  status: manually_verified
  key_findings:
    - "Official NBA.com/team-release evidence now uses the same `corroboration_only` source-record/source-event path as NBA player movement."
    - "Audit-time reconciliation now considers loaded corroborating rows from `nba_player_movement`, `nba_official`, and `team_official`."
    - "Multiple exact corroborating sources can now reinforce one canonical event instead of creating false ambiguity."
    - "The expanded official-source load eliminated the trade `conflict_suspected` bucket and pushed the remaining unresolved player-movement residue into straight coverage gaps."
    - "Follow-on batches closed the recent 2025 transaction cluster, multiple draft-night trade rows, both 2024 Matthew Hurt 10-day signings, and the 2024 Cam Spencer / Ulrich Chomche trade."
    - "The latest Grizzlies team-news batch closed 10 recent camp/preseason signings and reduced the recent unresolved residue to five events."
    - "Live official HTML fetches now strip NUL bytes before persistence, preventing Postgres JSON write failures during corroboration-only loads."
    - "The BRef repair now excludes same-day sign-and-trade contract rows from canonical derivation, and the canonical loader now fully replaces stale rows instead of leaving superseded events behind."
    - "The final four recent unresolved 2023 events are no longer `bref_only`; the August 31 Gregory Jackson signing now lands as `recognized_provider_not_loaded`, and the October 16 Timmy Allen / Jason Preston / Matthew Hurt cluster now lands as `meets_minimum`."
    - "The exact source basis for the closeout is now explicit: `https://gleague.nba.com/news/memphis-grizzlies-sign-gg-jackson-ii-to-two-way-contract` for Gregory Jackson II and `https://www.nba.com/players/transactions` plus secondary confirmation for the October 16 cluster."
    - "The 2022-09-23 through 2022-10-14 preseason/camp cluster is now closed from a `bref_only` perspective using the official Grizzlies playoff media guide transaction log plus the direct Dakota Mathias release."
    - "Those 8 events now land as `recognized_provider_not_loaded`, not `meets_minimum`, because the pass added team-official corroboration without loading a matching structured player-movement source role through the canonical-event path."

