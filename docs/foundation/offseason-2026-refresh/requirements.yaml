summary:
  problem: "The checked-in foundation and visualization stop before the 2026 draft and most 2026 offseason activity. Existing loaders, audit constants, daily-state bounds, draft fixtures, and export bounds are capped at the 2025 draft or 2025-26 season."
  motivation: "The visualization must reflect current Memphis asset truth before visual refinement or personal-site integration."
  requested_outcome: "Refresh source-backed Memphis lineage through 2026-08-16, rebuild the derived database layers and graph artifacts, and preserve explicit uncertainty where official evidence is incomplete."

goals:
  - "Add truthful 2026 draft selections and draft-night asset continuity, including intermediate rights movements."
  - "Add verified post-2026-05-29 trades, signings, waivers/buyouts, roster changes, and pick movements."
  - "Extend season, daily-state, audit, and export bounds into the 2026 offseason without claiming an opening-night 2026-27 roster."
  - "Update source-backed pick-obligation and two-way semantics where evidence supports exact rows."
  - "Use guarded previews before database writes, then rebuild canonical, daily-state, inventory, export, and visualization surfaces."
  - "Regenerate checked-in graph artifacts and record new counts, checksums, coverage, and limitations."

non_goals:
  - "Do not redesign the visualization or integrate it into personal-site in this pass."
  - "Do not treat an August offseason roster as a validated 2026-27 opening roster checkpoint."
  - "Do not invent years, protections, transaction dates, contract types, or pick identities absent from adequate evidence."
  - "Do not use load-foundation-full-span --replace-existing or perform a schema wipe."
  - "Do not reintroduce legacy editorial, chapter, or narrative architecture."

constraints:
  technical:
    - "Keep foundation source provenance separate from canonical lineage truth."
    - "NBA Player Movement and official-release rows remain corroboration-only until an explicit reconciliation path promotes verified semantics."
    - "All new or changed write paths must support a read-only preview or dry-run and reject unresolved blocking rows."
    - "Preserve stable IDs and historical canonical checksums except where new post-cutoff truth necessarily extends them."
    - "Use local .env database configuration without exposing credentials."
    - "Database changes must use checked-in code and existing guarded loader conventions."
    - "Official events may enter canonical truth only through an explicit checked-in reconciliation manifest with exact source-event IDs, expected participant/pick signatures, official_locked precedence, and explicit suppression of equivalent later BRef rows."
    - "Use one as_of_date value across snapshots, daily state, audit, base export, visualization export, and CLI; no emitted dated row may exceed it."
  product:
    - "Render/source coverage should extend through 2026-08-16 while retaining the 2016 start."
    - "The graph must represent exact player and pick continuity for verified trades and draft conversions."
    - "The five unidentified draft-night seconds must be represented as two additive, non-projectable aggregate bundles (OKC quantity 2; DET quantity 3), not concrete picks or graph strands."
    - "Carson Cooper must remain a non-loadable verified-by observation unless an authoritative exact effective date is found; 2026-07-04 must not be encoded as his signing date."
  process:
    - "Use the $work large-initiative workflow and stop at the pre-execution checkpoint."
    - "Use data-engineer agents for implementation and reviewer/tester agents for verification."
    - "Do not perform live writes until focused tests and source previews pass."

assumptions:
  - "Official NBA and Memphis sources are authoritative for the post-May event inventory."
  - "Basketball-Reference remains a useful normalization source through 2026-06-30 but may not expose a usable 2026-27 Memphis transaction page yet."
  - "The existing canonical/export architecture can be extended additively without a new database schema."
  - "The visualization should be continuously current through the research cutoff rather than frozen at 2026-06-30."
  - "Existing JSONB source-event payloads can persist reconciliation metadata and unresolved aggregate pick bundles without a SQL migration."

