  - "Every verified post-May Memphis event is either represented in canonical lineage or explicitly listed as non-lineage/context-only with a reason."
  - "The draft-night rights chain preserves Stirtz to Okorie to Lopez continuity and exposes two unresolved bundles totaling five seconds without creating picks, assets, transitions, snapshots, lanes, or strands for them."
  - "The six-team trade records every official Memphis player, rights, pick, protection, and swap leg."
  - "Currentness, season, daily-state, and export bounds use one explicit 2026-08-16 as_of_date; no generated state, event, snapshot, interval, segment, or connector exceeds it."
  - "2026 draft selections resolve to pick assets and prior-owner lineage where evidence permits."
  - "Two-way and future-pick fixtures are refreshed or carry explicit unresolved limitations."
  - "All live writes are preceded by a persisted go/no-go preview report proving zero stable-ID conflicts, unresolved required aliases, out-of-cutoff rows, unapproved historical changes/deletions, or unclassified equivalent-source collisions."
  - "Official promotion is idempotent: reruns preserve canonical IDs/checksums, and a later explicitly suppressed BRef equivalent cannot duplicate the event or transitions."
  - "A checked-in event reconciliation ledger covers every reviewed post-May event and Memphis leg with source URL, asserted semantics, disposition, uncertainty, and exact source-event identity."
  - "Carson Cooper appears as a verified-by, non-loadable limitation unless an authoritative exact start date is found, and never enters daily two-way occupancy from an inferred date."
  - "Foundation audit, graph baseline, visualization baseline, full Python tests, frontend tests/check/build, and artifact regeneration pass."
  - "Documentation records new counts/checksums, source review dates, unknowns, and the distinction between current offseason state and opening-roster validation."

