objective: "Implement canonical encoding/digests, restricted artifact storage, fingerprints, and deterministic read-only 21-table foundation snapshot capture from the immutable table manifest."
why_this_matters: "A later approved refresh needs an exact preimage and verifiable operational inputs so recovery can be exact rather than inferred from candidate IDs."
