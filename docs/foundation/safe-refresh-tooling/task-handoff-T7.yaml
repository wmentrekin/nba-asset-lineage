  forbidden: ["Generic table arguments", "Credentials in artifacts", "Live database access in tests", "Live network access", "SQL migrations", "Actual snapshot against Supabase", "personal-site/", "legacy/"]
implementation_notes:
  - "Use the exact manifest table/column/key/restore contract; never derive an arbitrary table name from CLI input."
  - "Use canonical UTF-8 JSON and domain-separated digests exactly as plan.yaml specifies, with closed tagged DB value types rather than default=str."
  - "Enforce repository-derived tmp/<refresh-id>/, restrictive modes, no-follow exclusive atomic writes, and fail-closed verification."
  - "Read-only snapshot capture must issue only manifest-defined SELECTs and have deterministic output in fake-connection tests."
  - "Capture logical schema/database fingerprints without serializing credentials or raw environmental secrets."
success_criteria: ["Golden canonical digest vectors", "Restricted storage tamper/path/mode protection", "Exact 21-table manifest-driven snapshot contract", "Read-only deterministic fake snapshot capture", "No credentials or raw secrets in artifacts", "No live systems touched"]
