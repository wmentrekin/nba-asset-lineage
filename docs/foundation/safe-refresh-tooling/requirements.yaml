research:
  repo_findings:
    - "Existing pure source normalizers can consume captured bytes after small I/O separation."
    - "Canonical, inventory, daily-state, prior-owner, and visualization builders are already mostly pure."
    - "Base export assembly is the major remaining DB-coupled seam."
    - "Source-event replacement cascades canonical membership; canonical replacement nulls obligation canonical links, so canonical must precede obligation reload."
    - "Upsert-only entity behavior makes an ID-only recovery snapshot insufficient; the full active foundation preimage is required."
    - "tmp/ is already ignored and is the correct restricted operational-artifact root."
  platform_findings: []

acceptance_criteria:
  - "Locked bundle validation rejects tampering, missing/duplicate/path-traversal items, schema/scope mismatch, and digest drift."
  - "Capture is atomic and fetches each URL once; official bundles also lock curated normalization definitions."
  - "All four source loaders reject execution without a locked bundle, exact digest, and --execute before opening a DB connection; execution never performs network I/O."
  - "preview-refresh-projection overlays candidates with SQL-equivalent semantics and performs no writes."
  - "Projection produces deterministic per-surface diffs/checksums and the same base export as the database wrapper for equivalent inputs."
  - "Shared mutation plans produce identical final table state through the pure in-memory adapter and registered-table database adapter in differential tests."
  - "Projection blockers propagate rather than silently dropping unresolved aliases, resolution, obligation, daily-state, prior-owner, or cutoff failures."
  - "Snapshot capture includes exactly all 21 active tables, deterministic schema/row digests, no credentials, restricted permissions, and a read-only repeatable-read contract."
  - "A checked-in immutable table manifest enumerates every table's exact columns, row keys, schema signature, FK-safe insert order, and reverse delete order, and offline tests reconcile it with SQL 0001-0007."
  - "Approval validation binds explicit user-go metadata to exact baseline, payload, local fixture, projection, reconciliation, snapshot, and execution-plan digests."
  - "Approval and resume also bind implementation, environment, dependency-lock, dirty-tree, table-contract, and per-prefix database fingerprints through closed versioned schemas and atomic state transitions."
  - "Approved runner rejects every stale/mismatched input before writes and encodes the tested order: sources, entities, snapshots, draft resolution, canonical, obligations, inventory snapshots, two-way, daily state, prior owner, roster validation, additive lottery, verification."
  - "Resume is allowed only with unchanged approved inputs/code; changed inputs return to projection and approval."
  - "Restore validates exact snapshot/schema/database fingerprints, uses one guarded transaction and fixed table allowlist/order, rolls back on any mismatch, and commits only when the restored digest equals the baseline."
  - "All new tests pass without live network or database access; the existing full Python and frontend validation suites remain green."
  - "Docs state sensitivity, retention, cleanup, concurrency limitations, and that actual restore always requires separate user authorization."
  - "refresh-request.json, refresh-plan.json, and projection-report.json form a closed digest-linked artifact chain; bundle and fixture drift, malformed plan codecs, or broken links reject before a database connection, lock, state write, or mutation."
  - "Canonical JSON uses strict UTF-8 sorted compact encoding, closed types, domain-separated SHA-256, explicit self-digest exclusion, fixed item ordering, normalized dates/timestamps, and golden digest vectors."

open_questions: []
ready_for_planning: true
