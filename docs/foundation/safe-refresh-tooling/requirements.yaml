# Contract: durable task-definition handoff created by $work

artifact: requirements
feature: "foundation/safe-refresh-tooling"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: "The current refresh CLI refetches live sources between preview and execution, BRef writers lack digest/execute guards, no read-only command projects candidate rows through the full derived stack, and partial failures lack a recoverable database preimage."
  motivation: "The 2026 offseason refresh cannot safely reach its live-write checkpoint until the exact reviewed inputs and projected outcome are bound to guarded execution and recovery artifacts."
  requested_outcome: "Implement and verify code-only source locking, candidate projection, approval, execution-order, snapshot, resume, and restore tooling without accessing or mutating live systems."

goals:
  - "Capture NBA movement, BRef transactions, BRef draft, and official-release inputs once as raw-byte bundles with canonical SHA-256 manifests."
  - "Make all four refresh loaders preview and execute from the same validated bundle; execution requires --execute and the approved digest."
  - "Project candidate source/config rows over a read-only baseline entirely in memory through entities, resolution, canonical, inventory, daily state, prior owner, base export, and visualization export."
  - "Emit stable row-level diffs, blockers, warnings, and semantic checksums suitable for a go/no-go preview report."
  - "Capture a complete restricted local preimage of all active foundation tables and validate approval metadata against exact payload, fixture, projection, plan, snapshot, and baseline digests."
  - "Encode a dependency-safe approved refresh order, resumable forward recovery, and a separately guarded exact restore path."
  - "Add a closed, immutable refresh artifact chain so the named preview, runner, and restore CLI commands consume only approved materialized inputs and serialized typed plans."

non_goals:
  - "Do not fetch current live NBA/BRef/team data in this feature."
  - "Do not connect to or write the live Supabase database in this feature."
  - "Do not load any 2026 offseason transaction, draft, roster, pick, or two-way data."
  - "Do not create SQL migrations or change the foundation schema."
  - "Do not redesign the graph or modify personal-site."
  - "Do not broaden locked-bundle support to roster/reference loaders beyond the four sources required by the offseason refresh."

constraints:
  technical:
    - "Capture is the only layer allowed to perform network I/O; preview and execute consume locked local bytes only."
    - "Digest, scope, path, and schema validation must occur before opening a database connection."
    - "Projection loads one read-only baseline, then holds no connection and imports no write helpers."
    - "Projection overlay must mirror current per-source-record replacement and ancillary upsert/coalesce semantics."
    - "Projection and database execution must consume the same immutable typed FoundationMutationPlan objects; independent reimplementation of mutation semantics is forbidden."
    - "Base-export database reads and assembly must share a new typed pure seam so projected and real exports cannot diverge."
    - "Recovery snapshots cover exactly the 21 active foundation tables in one repeatable-read, read-only transaction."
    - "Operational payloads, snapshots, approval records, and execution state remain under ignored tmp/, mode-restricted, and never enter commits or PRs."
    - "Operational roots must be repo-local, symlink-free, exclusively created, no-follow validated, atomic-written, mode 0700/0600, and contain only allowlisted response metadata."
    - "Restore remains a separate destructive command that fails closed without explicit --execute and exact approved snapshot digest."
    - "Operational CLI commands accept only --artifact-directory (and --execute where a connection or local artifact write is opened); they never accept caller-supplied SQL, table, generic JSON, step, or arbitrary input-path arguments."
  product:
    - "Sanitized reports may expose only counts, IDs, changed field names, and digests—not raw database rows or full source bodies."
    - "The tooling must preserve the parent refresh's 2026-08-16 cutoff and historical-checksum gate."
  process:
    - "Implementation and verification use unit tests, fixtures, fake connections, and local generated temporary directories only."
    - "Any need for a schema migration or live-system access returns to planning."

assumptions:
  - "Existing source normalizers and most derived builders are reusable as pure functions."
  - "A FoundationExportInputs extraction is sufficient to make base export assembly pure."
  - "A full 21-table preimage is safer and smaller in engineering scope than exact affected-row recovery across heterogeneous loaders."
  - "The approved runner coordinates existing checked-in loaders rather than replacing their domain logic."

