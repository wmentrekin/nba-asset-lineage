  - "The preview adapter persists only the plan/report/reconciliation artifacts to the restricted leaf. Runner requires action=execute_refresh. Restore requires action=restore_snapshot and the fixed snapshot."
  - "Use dependency injection/fakes for all connection and builder seams; prove all invalid inputs fail before connection, lock, state write, or mutation."
success_criteria: ["All three plan-named commands exist and help-test", "Artifact/input/chain drift rejects before any DB connection", "Preview uses one read-only baseline and writes only restricted local artifacts", "Runner/restore require --execute and correct approval action", "No live systems touched"]
validation_expected: ["Input/chain drift rejects before DB connect", "Preview reads baseline once and writes only restricted local artifacts", "Runner/restore require --execute and correct action", "CLI help and fake-only end-to-end artifact-chain tests"]
