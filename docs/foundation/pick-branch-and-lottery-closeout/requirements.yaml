    - "docs/foundation/data-gap-closure/*"

research:
  repo_findings:
    - "The future-pick fixture has exactly two non-loadable rows, both explicit conditional fallbacks: the Lakers 2027 second fallback and the Orlando 2029 second fallback."
    - "Those fallback rows are already source-backed, intentionally non-loadable, and explicitly documented as non-projectable until exclusivity semantics are modeled."
    - "The audit currently elevates those non-loadable fallback documentation rows into an open low-severity gap."
    - "Draft lottery rows are already fixture-backed, previewable, loadable, tested, and live-loaded into `foundation.draft_lottery_result`."
    - "The audit still emits a low-severity open gap that draft lottery results are 'seed-loaded contextual metadata' even when the table is populated."
    - "The base graph export intentionally does not consume draft lottery results."
    - "The `load-foundation-full-span` payload still contains stale wording that draft lottery results are not loaded by that command."
    - "The lottery fixture validator currently applies loadable-row validation only to the last fixture row; that guardrail must be fixed before closeout."
  platform_findings: []

acceptance_criteria:
  - "Audit no longer reports the two conditional fallback pick rows as an open remaining gap when they are fully source-backed documentation rows."
  - "Audit no longer reports loaded draft lottery rows as an open remaining gap."
  - "Lottery fixture validation truthfully validates every loadable fixture row, not only the last row."
  - "The repo still preserves explicit limitations showing that fallback pick rows are documented-only and that lottery rows remain outside the base graph export."
  - "The base graph export remains unchanged for lottery data."
  - "No new live projection of mutually exclusive fallback pick assets is introduced."
  - "Focused tests and full relevant validation pass."
  - "Active docs and CLI wording match the new closure contract."

open_questions:
  - "Whether the conditional fallback residue should remain visible only in limitation/report surfaces or also in a dedicated non-gap audit section."

ready_for_planning: true
planning_blockers: []
