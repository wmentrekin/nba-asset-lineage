artifact: requirements
feature: "foundation/pick-branch-and-lottery-closeout"
mode: "bounded-feature"
status: completed
owner_skill: work

summary:
  problem: "The only remaining structural gaps are still being reported as open even though both underlying data surfaces already exist and are intentionally outside the minimum graph-truth contract."
  motivation: "Close the last active foundation gap classifications without inventing broader branch or editorial systems that the reset repo explicitly deferred."
  requested_outcome: "Reclassify conditional fallback pick rows and loaded draft lottery rows truthfully so they no longer appear as open gaps, while preserving their documented limitations and keeping the base graph export unchanged."

goals:
  - "Close the conditional future-pick branch gap without projecting mutually exclusive fallback assets into the live snapshot surface."
  - "Close the draft-lottery integration gap without forcing lottery rows into the base graph export."
  - "Keep fallback pick rows and lottery rows available as additive/contextual foundation data with explicit limitations."
  - "Remove stale open-gap wording from audit, CLI, and active docs."
  - "Preserve the reset-era minimum graph contract."

non_goals:
  - "Do not add a full conditional-branch solver that projects all mutually exclusive future-pick outcomes."
  - "Do not add draft lottery events, nodes, or strands to the base graph export."
  - "Do not reopen supplemental corroboration-depth work."
  - "Do not broaden into frontend, narrative, or annotation rendering."

constraints:
  technical:
    - "All changes must remain in the active reset track."
    - "Live write paths, if any, must stay in checked-in Python/CLI commands."
    - "The existing pick fallback rows must remain non-projectable unless there is a truthful exclusivity model."
    - "The graph-facing export should remain unchanged for lottery data."
    - "Tests must be updated alongside any audit-contract changes."
  product:
    - "The minimum truthful graph remains the Memphis-only 10-year asset evolution graph."
    - "Conditional fallback obligations may remain documented-only if that is the truthful representation."
    - "Lottery results may remain contextual metadata if that is the truthful representation."
  process:
    - "Use `$work` and keep the closeout bounded."
    - "Use parallel agents where they materially help."
    - "Stop at the execution checkpoint before code changes."

assumptions:
  - "The two non-loadable future-pick rows are already fully source-backed documentation rows and the remaining residue is primarily audit classification."
  - "The lottery feature is already loaded, but the closeout must first repair any stale validation bug before the gap is reclassified."
  - "The right finish line is closure of open-gap classification, not expansion of graph scope."

