    - "docs/foundation/full-span-load-notes.md"
  systems_in_scope:
    - "roster snapshot generation"
    - "daily roster-state derivation"
    - "draft pick resolution"
    - "pick inventory obligation lineage"
    - "graph-ready export"
    - "foundation audit"
  prior_artifacts:
    - "docs/foundation/official-roster-checkpoints/*"
    - "docs/foundation/future-pick-inventory-snapshots.md"

research:
  repo_findings:
    - "Current roster snapshots are only four seasonal checkpoints built by `build_roster_snapshots_from_baselines()` from baseline rows plus membership events."
    - "Current export emits `roster_snapshots`, but not daily roster state."
    - "Current `draft_pick_resolution` resolves selected-player continuity through slot picks and `pick_to_player` transitions only."
    - "Current pick inventory surfaces owner/original-team semantics on obligations and snapshot picks, but not on a draft-night bridge from prior owner to selected slot."
    - "Current docs are slightly drifted: some active docs still describe `roster_snapshots` as future/empty despite live population."
  platform_findings:
    - "No extra external source research was required for planning; the current blocker is internal contract definition, not provider discovery."

acceptance_criteria:
  - "A live read-only audit can truthfully report that daily roster state is present for the covered span rather than only seasonal checkpoints."
  - "The graph/export surface can expose daily roster state without changing the meaning of the existing checkpoint `roster_snapshots`."
  - "Each Memphis draft selection can be traced through a durable prior-owner bridge rather than only a slot-based `pick_to_player` transition."
  - "Current checkpoint validation and current draft-slot resolution continue to work."
  - "Relevant tests pass and the graph contract remains coherent."
  - "Active docs are updated to reflect the new daily-state and draft-lineage surfaces."
  - "The live audit no longer reports daily roster state generation or draft-night prior-owner lineage as remaining gaps."

open_questions:
  - "Can the prior-owner draft bridge be fully derived from obligation rows plus own-pick baseline, or will a tiny curated bridge fixture still be needed for a minority of selections?"

ready_for_planning: false
planning_blockers: []
