artifact: requirements
feature: "foundation/official-roster-checkpoints"
mode: "bounded-feature"
status: completed
owner_skill: work

summary:
  problem: "The roster-checkpoint layer originally had 40 Memphis `foundation.roster_snapshot_validation` rows and all 40 were `source_missing` because no loaded official season roster-reference source records existed for the validator to consume."
  motivation: "Roster checkpoints are part of the base graph export, so the source-backing status for those checkpoints needs to be explicit and truthful."
  requested_outcome: "Get the checkpoint layer out of `source_missing` with a truthful official season-reference surface and explicit validation metadata, without pretending the snapshots are exact archived point-in-time official rosters."
  achieved_outcome: "Loaded 10 official roster-reference source records through a checked-in normalized fixture, reran validation, and moved the 40 checkpoint rows to `season_reference_backed=1`, `season_reference_incomplete=39`, `source_missing=0`."

goals:
  - "Load official season roster-reference source records for the full Memphis checkpoint span."
  - "Keep the current date-aware event-derived checkpoint builder."
  - "Make checkpoint validation explicit in the live audit."
  - "Keep the graph export coherent while improving the truth surface behind roster checkpoints."

non_goals:
  - "Do not claim exact day-of-checkpoint official occupancy."
  - "Do not broaden this pass into daily roster state generation."
  - "Do not broaden this pass into full two-way completeness, contract semantics, or frontend rendering changes."
  - "Do not perform destructive database operations."

constraints:
  technical:
    - "All live writes must go through checked-in Python/CLI commands."
    - "The roster-reference fallback must normalize into the existing `team_code` + `season` + `roster_rows` contract."
    - "The graph-facing checkpoint schema should remain unchanged."
  product:
    - "Truthfulness matters more than cosmetically maximizing match counts."
    - "Memphis-only scope remains the target."
  process:
    - "Use `$work` orchestration and parallel source lookup where helpful."
    - "Keep the official-roster-checkpoint docs current."

assumptions:
  - "The truthful finish line for this pass is season-scoped official validation, not a new exact historical roster loader."
  - "Direct live `stats.nba.com` `CommonTeamRoster` access is not reliable enough from this environment to be the only closeout path."

repo_context:
  relevant_paths:
    - "src/foundation/live_sources.py"
    - "src/foundation/roster_validation.py"
    - "src/foundation/audit.py"
    - "src/redesign_cli.py"
    - "configs/data/memphis_official_roster_reference_sources_v1.json"
    - "docs/foundation/full-span-load-notes.md"

research:
  repo_findings:
    - "The validator now accepts normalized official roster-reference source records from an allowlist instead of only `nba_stats/common_team_roster`."
    - "The checked-in fixture loader writes `foundation.source_record` rows only; it does not mutate graph-facing checkpoint rows directly."
    - "Checkpoint validation reads stored `raw_payload.roster_rows` from loaded source records and reports `season_reference_backed`, `season_reference_incomplete`, or `source_missing`."
  platform_findings:
    - "Direct live `stats.nba.com` `CommonTeamRoster` fetches timed out repeatedly from this environment."
    - "Official fallback sources that were stable enough for this pass included NBA PR opening-night PDFs, official Grizzlies articles, and official NBA game-book PDFs."

acceptance_criteria:
  - "The checkpoint layer is no longer `source_missing`."
  - "The audit reports checkpoint validation state explicitly."
  - "The implementation does not mislabel event-derived checkpoints as exact point-in-time official rosters."
  - "Relevant tests pass and the graph checksum remains stable."

results:
  local_validation:
    focused_tests: "78 passed"
    full_pytest: "194 passed"
  live_verification:
    source_records_loaded: 10
    snapshot_validations: 40
    validation_status:
      season_reference_backed: 1
      season_reference_incomplete: 39
      source_missing: 0
    graph_export_checksum_sha256: "a9748140971aa69146311c9cd9d2b9ee7ec9d4f1319a0d8262d94d66390a3f8b"

open_questions:
  - "If future work wants higher checkpoint match rates, should the next pass load broader official season-membership surfaces instead of mainly opening-night references?"
