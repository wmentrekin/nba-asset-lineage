artifact: plan
feature: "foundation/official-roster-checkpoints"
mode: "bounded-feature"
status: completed
owner_skill: work
based_on: "docs/foundation/official-roster-checkpoints/requirements.yaml"

objective: "Get the Memphis roster checkpoint layer out of `source_missing` with a truthful official season-reference backing."

approach:
  summary: "Keep the current event-derived checkpoint builder, broaden the validator to accept normalized official roster-reference records, add a checked-in official fixture loader, populate the Memphis 2016-17 through 2025-26 span, and rerun validation plus audit."
  key_decisions:
    - "Use a normalized `curated_fixture` fallback because live `stats.nba.com` was not a reliable execution path from this environment."
    - "Preserve the existing `team_code` + `season` + `roster_rows` contract."
    - "Use official opening-night / opening-week references when no broader stable official season-membership surface was available."
    - "Treat `season_reference_incomplete` as an honest residual state rather than inflating the fixture beyond what the cited source supports."

execution_batches:
  - id: "B1"
    goal: "Generalize the official roster-reference contract."
    result: "completed"
    notes:
      - "Broadened validator and audit handling from `nba_stats`-only to a normalized official roster-reference allowlist."
  - id: "B2"
    goal: "Add the official-derived fixture load path."
    result: "completed"
    notes:
      - "Added preview/load commands for a checked-in official roster-reference fixture."
  - id: "B3"
    goal: "Load official season membership for the Memphis span."
    result: "completed"
    notes:
      - "Built `configs/data/memphis_official_roster_reference_sources_v1.json` with 10 season records."
      - "Used parallel season-source lookup to collect exact official roster names and citations."
  - id: "B4"
    goal: "Execute and verify the full pass."
    result: "completed"
    notes:
      - "Loaded 10 source records into Supabase."
      - "Refreshed 40 roster snapshot validation rows."
      - "Confirmed `source_missing=0` and stable graph checksum."

validation:
  local:
    - "./.venv/bin/pytest tests/foundation/test_live_sources.py tests/foundation/test_roster_validation.py tests/foundation/test_audit.py"
    - "./.venv/bin/pytest"
  live:
    - "./.venv/bin/python -m redesign_cli preview-official-roster-reference-fixture"
    - "./.venv/bin/python -m redesign_cli load-official-roster-reference-fixture --execute"
    - "./.venv/bin/python -m redesign_cli load-roster-snapshot-validation --team-code MEM"
    - "./.venv/bin/python -m redesign_cli audit-foundation-data"
    - "./.venv/bin/python -m redesign_cli inspect-foundation-graph-baseline"

results:
  source_records_loaded: 10
  reference_source_records: 10
  validation_status:
    season_reference_backed: 1
    season_reference_incomplete: 39
    source_missing: 0
  graph_export_checksum_sha256: "a9748140971aa69146311c9cd9d2b9ee7ec9d4f1319a0d8262d94d66390a3f8b"

residual_risks:
  - "Opening-night and opening-week sources do not capture every later-season roster addition, so most checkpoint rows remain `season_reference_incomplete`."
  - "This pass closes the missing-source gap, not the broader season-membership-depth gap."

checkpoint:
  required_before_execution: true
  status: completed
