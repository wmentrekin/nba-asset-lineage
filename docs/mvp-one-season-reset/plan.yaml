# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "mvp-one-season-reset"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/mvp-one-season-reset/requirements.yaml"

objective: "Replace the repo with a minimal, deterministic, one-season Memphis asset-lineage pipeline: raw feed -> 6-table lineage schema -> validated graph JSON + SVG."

approach:
  summary: >
    Wipe to the framework skeleton. Build a small Python package `src/lineage/` with six CLI
    verbs (migrate, fetch, derive, validate, export, render). Raw feed payloads are stored
    verbatim; everything downstream is a pure, idempotent function of (raw payloads, three curated
    JSON files, code). The parser is finalized only after a real payload is captured by the first
    GitHub Actions run and read back through Supabase, because this sandbox cannot fetch it.
  key_decisions:
    - "Schema `lineage`, five tables: source_record, player, pick, transaction, asset_movement. No baseline table: the opening-night snapshot is loaded as a curated source_record plus one virtual transaction (id OPENING-2025-26, kind baseline) whose asset_movement rows have from_holder NULL and to_holder MEM."
    - "Strands are not stored; a shared helper lineage/timeline.py builds the per-asset holder timeline (sort key: occurred_on, transaction.id, asset_movement.id) and both validate and export call it."
    - "Holders are plain codes: NBA team tricode (MEM, PHX...), FA (free agency/unsigned), DRAFT (pre-selection pick pool). No team table."
    - "Pick identity is a natural key `{draft_year}-R{round}-{original_team}` so picks are stable across trades."
    - "Derive reads exactly one feed source_record (max fetched_at) plus the curated snapshot source_record, truncates and rebuilds transaction/asset_movement/player/pick inside one DB transaction, and inserts rows in a fully deterministic order (occurred_on, group_key, asset_type, asset_id). counterparties is a denormalized convenience column, not truth."
    - "Corrections are applied after parsing, before load, as declarative row overrides/additions keyed by (source group key, asset id)."
    - "REVISED after capturing the real feed (2026-09-18): the feed itemizes players only. Pick movement appears solely as a 'draft consideration' leg (PLAYER_ID 0, no year/round), and draft selections appear only as later 'Rookie Scale Contract' signings. Therefore pick truth is curated in data/pick_events.json (keyed by feed GroupSort) rather than parsed from text; the feed's draft-consideration legs become a deterministic cross-check that validate enforces (warn when a leg has no curated picks, fail with --strict)."
    - "Feed Transaction_Type values observed: Signing, Waive, Trade, ContractConverted, AwardOnWaivers. Kind mapping: Trade->trade; Waive->waiver; ContractConverted->two_way_conversion; AwardOnWaivers->signing; Signing-> two_way_signing if description contains 'Two-Way Contract', ten_day if '10-Day Contract', else signing (covers 'Contract', 'Rookie Scale Contract', 'Rest-of-Season Contract', 'Veteran Extension'). contract_type from the same keywords: two_way | ten_day | standard."
    - "Re-signings, extensions and conversions are MEM->MEM movements carrying the new contract_type; they are legitimate nodes that do not change the holder."
    - "Asset origin rule: an asset's first movement has from_holder NULL (baseline) or an entering holder (FA, DRAFT, or a non-MEM team code); every later movement's from_holder equals the previous to_holder."
    - "Fetch uses a browser-like User-Agent and stores payload_sha256; identical payloads are not stored twice."
    - "Window start = as_of date in data/opening_snapshot_2025_26.json; rows before it are dropped except those needed to explain a baseline holding (none expected)."
    - "SVG: x = time, one horizontal lane per asset (players top, picks below), a node marker per transaction date spanning the lanes it touches; hand-written SVG strings, no library."

contracts:
  interfaces:
    - "CLI: `uv run lineage <verb>` with verbs migrate | fetch [--payload-file] | derive | validate | export [--out] | render [--in --out]"
    - "mise tasks: setup, migrate, fetch, derive, validate, export, render, load (fetch+derive+validate+export+render), test"
    - "GitHub workflow lineage-load.yml: workflow_dispatch; runs `mise run load`; uploads graph.json + graph.svg + raw payload as artifacts"
  schemas:
    - "lineage.source_record(id bigserial pk, source text, source_url text, fetched_at timestamptz, payload jsonb, payload_sha256 text unique)"
    - "lineage.player(id integer pk /* NBA person id */, full_name text, slug text)"
    - "lineage.pick(id text pk, draft_year int, round int, original_team text, protections text)"
    - "lineage.transaction(id text pk, occurred_on date, kind text check(...), description text, group_key text, source_record_id bigint fk, counterparties text[])"
    - "lineage.asset_movement(id bigserial pk, transaction_id text fk, asset_type text check(player|pick), asset_id text, from_holder text, to_holder text, contract_type text null, note text null, unique(transaction_id, asset_type, asset_id))"
    - "graph.json: {window:{start,end}, nodes:[{id,date,kind,description,counterparties}], assets:[{id,type,label}], strands:[{asset_id, segments:[{from_node|null, to_node|null, holder, contract_type}]}]}"
  config_changes:
    - "pyproject.toml rewritten: package `lineage`, script `lineage = lineage.cli:main`, deps pydantic, psycopg[binary], httpx; dev pytest."
    - "mise.toml rewritten (python 3.11, uv; node removed)."
    - ".gitignore trimmed; `exports/` and `.env` ignored."
    - "data/opening_snapshot_2025_26.json (players + ALL Memphis-owned future draft picks as of opening night), data/pick_events.json (curated pick movements per trade GroupSort + 2026 draft selections), data/corrections.json added."

branching:
  strategy: "single-branch"
  branch_name: "work/mvp"
  worktrees: []

execution_batches:
  - id: "B0"
    goal: "Wipe and skeleton"
    tasks:
      - id: "T0.1"
        title: "Delete old implementation; write skeleton"
        objective: "git rm everything except .agents/, .claude/, LICENSE, .gitignore, .python-version, .github/workflows/{db-keepalive,db-backup}.yml. Write new README.md, AGENTS.md, CLAUDE.md pointer, pyproject.toml, mise.toml, empty src/lineage/__init__.py, tests/, data/, sql/ dirs. uv lock."
        assigned_domain: "generalist-developer"
        model_routing: {task_profile: implementation, uncertainty: low, consequence: medium, scope_size: bounded, determinism: deterministic, requested_tier: fast, requested_reasoning: medium, provider_model: "Claude Haiku 4.5", routing_enforced: true, escalation_tier: balanced, escalation_condition: "uv lock or tooling fails unexpectedly"}
        owned_scope: ["repo root files", "src/", "tests/", "data/", "sql/", "docs/ (except docs/mvp-one-season-reset/)"]
        forbidden_scope: [".agents/", ".claude/", "docs/mvp-one-season-reset/", ".github/workflows/db-*.yml"]
        dependencies: []
        parallelizable: false
        expected_validation: ["git status shows only intended paths", "uv sync succeeds", "uv run lineage --help prints verbs (stub)"]
  - id: "B1"
    goal: "Schema and DB reset"
    tasks:
      - id: "T1.1"
        title: "Write sql/0001_lineage.sql and migrate verb"
        objective: "Five tables per contracts; `lineage migrate` applies sql/*.sql idempotently (create schema/table if not exists)."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: low, consequence: medium, scope_size: bounded, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "schema cannot express a required contract"}
        owned_scope: ["sql/", "src/lineage/db.py", "src/lineage/cli.py (migrate)"]
        forbidden_scope: ["live DB writes"]
        dependencies: ["T0.1"]
        parallelizable: true
        expected_validation: ["SQL parses (psql --dry via python sqlparse-free: apply against a throwaway schema name in tests? -> at minimum: unit test loads file and asserts 6 CREATE TABLE statements)"]
      - id: "T1.2"
        title: "Backup then drop `foundation`; apply lineage schema"
        objective: "Orchestrator-run with explicit user go: trigger db-backup.yml (or MCP dump), confirm artifact, `drop schema foundation cascade`, apply sql/0001 via Supabase MCP."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: low, consequence: high, scope_size: narrow, determinism: deterministic, requested_tier: frontier, requested_reasoning: high, provider_model: "session model (orchestrator)", routing_enforced: false, escalation_tier: frontier, escalation_condition: "backup cannot be confirmed"}
        owned_scope: ["Supabase live DB"]
        forbidden_scope: ["any other schema"]
        dependencies: ["T1.1"]
        parallelizable: false
        expected_validation: ["backup artifact exists", "list_tables shows lineage.* only (plus system)"]
  - id: "B2"
    goal: "Fetch, raw store, CI capture"
    tasks:
      - id: "T2.1"
        title: "fetch verb + lineage-load.yml"
        objective: "httpx GET of the player-movement feed with browser UA; store source_record (sha dedup); `--payload-file` for offline use. Workflow with workflow_dispatch running mise load, uploading artifacts; fetch step alone must succeed even if later verbs are stubs."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: medium, scope_size: bounded, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "feed unreachable from CI"}
        owned_scope: ["src/lineage/fetch.py", "src/lineage/cli.py (fetch)", ".github/workflows/lineage-load.yml", "mise.toml tasks", "tests/test_fetch.py"]
        forbidden_scope: ["parser logic"]
        dependencies: ["T1.1"]
        parallelizable: true
        expected_validation: ["pytest with a stub payload", "user triggers workflow; run green through fetch; orchestrator reads source_record via Supabase MCP"]
  - id: "B3"
    goal: "Deterministic derive"
    tasks:
      - id: "T3.1"
        title: "Curated opening-night snapshot"
        objective: "One file, data/opening_snapshot_2025_26.json: as_of date; players (NBA person id, name, contract_type, source_url); and every future draft pick Memphis owns as of opening night — own picks and acquired picks, both rounds, through the furthest tradable year — with original_team, round, protections, source_url. Drafted by orchestrator from knowledge, marked `verified: false` until the user confirms each row."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: research, uncertainty: high, consequence: high, scope_size: narrow, determinism: interpretive, requested_tier: frontier, requested_reasoning: high, provider_model: "session model (orchestrator)", routing_enforced: false, escalation_tier: frontier, escalation_condition: "cannot establish a fact; leave verified:false and list for user"}
        owned_scope: ["data/*.json"]
        forbidden_scope: ["src/"]
        dependencies: ["T0.1"]
        parallelizable: true
        expected_validation: ["JSON schema check in tests", "user review"]
      - id: "T3.2"
        title: "Feed parser, pick events, corrections, derive verb, timeline"
        objective: "Map feed rows (filtered to Memphis-involved, date >= window start) to transaction + asset_movement; group trade rows by group key; strict pick grammar over description text producing pick rows with natural keys; apply data/corrections.json; fail loudly on unparseable pick text or unknown transaction type; load in one DB transaction after truncating derived tables. Description text with swap-rights phrasing (more/less favorable, swap) is recognized, excluded from strict-grammar failure, and logged for a corrections.json entry rather than raising. Also loads the curated snapshot as a source_record + OPENING-2025-26 baseline transaction. Built against the real payload captured in T2.1."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: high, consequence: high, scope_size: bounded, determinism: interpretive, requested_tier: frontier, requested_reasoning: high, provider_model: "Claude Opus 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "feed shape contradicts assumptions"}
        owned_scope: ["src/lineage/parse.py", "src/lineage/picks.py", "src/lineage/derive.py", "src/lineage/timeline.py", "src/lineage/snapshot.py", "src/lineage/cli.py (derive)", "tests/fixtures/", "tests/test_parse.py", "tests/test_picks.py", "tests/test_derive.py"]
        forbidden_scope: ["sql/", "data/*.json except adding corrections entries with a note"]
        dependencies: ["T2.1 real payload available", "T3.1"]
        parallelizable: false
        expected_validation: ["pytest offline on captured fixture", "derive twice -> identical row sets (test via in-memory or against DB read-back)"]
  - id: "B4"
    goal: "Validate, export, render"
    tasks:
      - id: "T4.1"
        title: "validate verb"
        objective: "Invariants (via timeline.py): every asset has exactly one holder at any date; every movement's from_holder equals the prior holder; every asset has exactly one from_holder-NULL origin; no transaction without a source_record; every pick referenced exists; kinds within the allowed set. Non-zero exit and readable report on failure."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: medium, scope_size: bounded, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "invariant conflicts with real data in a way that suggests a model flaw"}
        owned_scope: ["src/lineage/validate.py", "tests/test_validate.py", "src/lineage/cli.py (validate)"]
        forbidden_scope: ["derive logic"]
        dependencies: ["T3.2"]
        parallelizable: true
        expected_validation: ["pytest: passes on fixture, fails on planted inconsistency"]
      - id: "T4.2"
        title: "export + render verbs"
        objective: "graph.json per contract; graph.svg hand-written: time axis, asset lanes, node markers, strand segments coloured by holder (MEM vs other)."
        assigned_domain: "generalist-developer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: low, scope_size: bounded, determinism: interpretive, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "none expected"}
        owned_scope: ["src/lineage/export.py", "src/lineage/render.py", "tests/test_export.py", "tests/test_render.py", "src/lineage/cli.py (export, render)"]
        forbidden_scope: ["derive/validate logic"]
        dependencies: ["T3.2"]
        parallelizable: true
        expected_validation: ["pytest", "SVG well-formed (xml.etree parse)", "user eyeballs graph.svg from CI artifact"]

  - id: "B5"
    goal: "Lineage render v2 + contract-expiry truth (owner feedback on PR #8: no convergence/divergence at nodes; departed assets never end; 10-days never expire; image too tall)"
    tasks:
      - id: "T5.1"
        title: "Ten-day expiry + strand termination semantics"
        objective: "derive emits a synthetic transaction `Expire-<signing group>` (kind expiry, occurred_on = signing date + 10 days, description '10-day contract expired', source_record = the feed record) with movement MEM->FA, unless the player has another movement on/before that date. A second 10-day re-signs FA->MEM. validate E1 stays consistent; export carries kind expiry; sql/0003 adds the kind (already applied live)."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: medium, scope_size: bounded, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "expiry rule conflicts with observed feed sequences"}
        owned_scope: ["src/lineage/derive.py", "src/lineage/timeline.py", "src/lineage/validate.py", "src/lineage/export.py", "tests/test_derive.py", "tests/test_validate.py", "tests/test_export.py", "tests/test_timeline.py"]
        forbidden_scope: ["src/lineage/render.py", "sql/", "data/"]
        dependencies: ["B4"]
        parallelizable: true
        expected_validation: ["pytest", "offline load: expiry nodes present for every ten_day not followed by another movement within 10 days; 0 errors"]
      - id: "T5.2"
        title: "Render v2: slot lanes with reuse, node hubs with converging/diverging connectors"
        objective: "Lanes are slots, not assets: an asset occupies a lane only while held by MEM; when it exits at a node the lane frees and an incoming asset at that node takes it (or the nearest free lane below the outgoing group). Each node is a hub at x=date; outgoing strands curve into the hub, incoming strands curve out of it. No post-exit segments; exit end-caps carry the destination (team code / FA / USED). expiry nodes are end-caps, not hubs. Target ~1600x<=900 for current data. Deterministic."
        assigned_domain: "generalist-developer"
        model_routing: {task_profile: implementation, uncertainty: high, consequence: medium, scope_size: bounded, determinism: interpretive, requested_tier: frontier, requested_reasoning: high, provider_model: "Claude Opus 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "lane-reuse heuristic cannot avoid crossings in current data"}
        owned_scope: ["src/lineage/render.py", "tests/test_render.py", "README.md (render paragraph)"]
        forbidden_scope: ["derive/timeline/validate/export logic", "sql/", "data/"]
        dependencies: ["B4"]
        parallelizable: true
        expected_validation: ["pytest", "cross-process byte-identical SVG", "owner eyeballs rasterized PNG"]

  - id: "B6"
    goal: "Pick truth + owner render feedback round 2 (PR #8 review, 2026-09-18)"
    tasks:
      - id: "T6.1"
        title: "Curated pick and event truth from research"
        objective: "Rewrite data/opening_snapshot_2025_26.json picks from the researched inventory (add 2026-R1-ORL; keep 2030-R1-ORL; own 1sts 2026-2032; own 2nds flagged low-confidence). Rename data/pick_events.json -> data/curated_events.json with sections: trades[] (group_key, picks in/out with pick_id/from/to/protections/source_url; swap rights as footnotes[]), draft_selections[] (Boozer 2026-R1-MEM #3; Lopez 2026-R1-ORL #21 with swap-down footnote; Saunders 2026-R2-MEM #32 unsigned), events[] (Brandon Clarke contract_void: date + source_url, movement MEM->none). Every row carries verified and confidence. Unknowns (DET 2nds years, NOP 2nd year, PHI/WAS 2032 swaps) recorded as footnotes, not assets."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: research, uncertainty: high, consequence: high, scope_size: narrow, determinism: interpretive, requested_tier: frontier, requested_reasoning: high, provider_model: "session model (orchestrator)", routing_enforced: false, escalation_tier: frontier, escalation_condition: "a fact cannot be sourced; leave verified:false"}
        owned_scope: ["data/"]
        forbidden_scope: ["src/"]
        dependencies: []
        parallelizable: true
        expected_validation: ["json loads", "derive dry-run consumes it"]
      - id: "T6.2"
        title: "Derive/validate/export: curated events, draft rights, contract_void"
        objective: "picks.py -> events.py reading curated_events.json (trades picks in AND out; draft_selections producing pick MEM->USED + player DRAFT->MEM contract_type draft_rights; events producing e.g. contract_void MEM->none with kind contract_void). A later Rookie Scale signing on a draft_rights player is MEM->MEM standard (already handled as a re-sign). Pick ids referenced but absent from the snapshot are created from the id. validate: W1 unchanged; E5 updated for draft_rights; new W5 for footnotes referencing uncurated assets. export: contract_type draft_rights flows through. sql/0004 (already applied live) adds kind contract_void and contract_type draft_rights."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: high, scope_size: bounded, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "curated schema cannot express a researched fact"}
        owned_scope: ["src/lineage/picks.py->events.py", "src/lineage/derive.py", "src/lineage/validate.py", "src/lineage/export.py", "src/lineage/cli.py", "tests/"]
        forbidden_scope: ["src/lineage/render.py", "sql/", "data/ (except reading)"]
        dependencies: ["T6.1"]
        parallelizable: false
        expected_validation: ["pytest", "offline load: draft nodes present; Clarke node present; pick strands enter/exit trade hubs; 0 errors"]
      - id: "T6.3"
        title: "Render v3: color semantics, ordering, legend"
        objective: "Strand color by contract_type (standard / two_way / ten_day / draft_rights) — same thickness; picks a fifth muted color. Node hub color by kind (trade / signing family / waiver+contract_void / draft_selection; expiry stays an end-cap). Remove destination flags (UTA/FA/DAL caps) — plain end-cap only. Player band ordering: assets held by MEM for the entire window first (in snapshot order), then everything else. Short tenures whose label does not fit get a numbered marker and a numbered legend block at the bottom listing name + dates. Legend updated for colors."
        assigned_domain: "generalist-developer"
        model_routing: {task_profile: implementation, uncertainty: medium, consequence: low, scope_size: bounded, determinism: interpretive, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "palette cannot pass the dataviz validator with five hues"}
        owned_scope: ["src/lineage/render.py", "tests/test_render.py", "README.md render section"]
        forbidden_scope: ["derive/validate/export", "sql/", "data/"]
        dependencies: []
        parallelizable: true
        expected_validation: ["pytest", "cross-process determinism", "owner eyeballs PNG"]

  - id: "B7"
    goal: "Render v4: compacting tenure-ordered stack (owner feedback round 3, 2026-09-21)"
    tasks:
      - id: "T7.1"
        title: "Tenure data + export contract"
        objective: "Snapshot players carry mem_since (done by orchestrator from the full feed: continuous stint at current tier; converted two-ways restart at conversion). export.py adds to each player asset `tenure_start` (baseline players: snapshot mem_since; others: date of their first MEM movement whose contract_type is not two_way; two-way-only players: date of first MEM movement) and to each pick asset `sort_key` [round, draft_year, original_team]. Segments already carry contract_type. No schema change."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: implementation, uncertainty: low, consequence: medium, scope_size: narrow, determinism: deterministic, requested_tier: balanced, requested_reasoning: medium, provider_model: "Claude Sonnet 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "none expected"}
        owned_scope: ["src/lineage/export.py", "src/lineage/snapshot.py (mem_since field)", "tests/test_export.py", "tests/test_snapshot.py"]
        forbidden_scope: ["src/lineage/render.py", "sql/", "derive/validate"]
        dependencies: []
        parallelizable: true
        expected_validation: ["pytest", "graph.json carries tenure_start for all 47 players"]
      - id: "T7.2"
        title: "Render v4: compacting stack"
        objective: "Rows are ranks, not slots. Three bands top to bottom: roster (standard + draft_rights + ten_day), two-way (3 rows), picks. At every node x, roster order = tenure_start ascending (longest tenure on top), ties by asset label; arrivals take the topmost open rank (which, by tenure, is the bottom of the current stack); departures make everything below shift up via a short S-curve after the node. Two-way band ordered the same way; a conversion (two_way -> standard at a MEM->MEM movement) or a draft selection curves the strand up into the bottom of the roster band with the color change. Picks band compact: only currently held picks, ordered round, draft_year, original_team with a half-row gap between draft years; trade arrivals insert in sorted position, departures (USED/traded) shift the rest up. Hubs/connectors, colors, numbered legend, no destination flags as in v3. Deterministic."
        assigned_domain: "generalist-developer"
        model_routing: {task_profile: implementation, uncertainty: high, consequence: medium, scope_size: bounded, determinism: interpretive, requested_tier: frontier, requested_reasoning: high, provider_model: "Claude Opus 5", routing_enforced: true, escalation_tier: frontier, escalation_condition: "rank changes produce unreadable crossings on current data"}
        owned_scope: ["src/lineage/render.py", "tests/test_render.py", "README.md render section"]
        forbidden_scope: ["export/derive/validate", "sql/", "data/"]
        dependencies: ["T7.1 contract (tenure_start, sort_key) — may stub until export lands"]
        parallelizable: true
        expected_validation: ["pytest", "cross-process determinism", "owner eyeballs PNG"]

ordering_notes:
  - "B0 -> B1 -> B2 -> (user triggers workflow) -> B3 -> B4 -> PR -> verification."
  - "T1.2 (destructive drop) is a separate explicit user go, not covered by plan approval; routed above-minimum tier deliberately because it is irreversible."
  - "T3.2 waits for a real payload; if CI cannot reach the feed, fallback is the user running `mise run fetch` locally and committing the filtered payload as a fixture."
  - "If both CI and a local scripted fetch are blocked, the user saves the feed response from a browser and commits it as the fixture payload."
  - "Docs for the shipped MVP live in README.md; docs/mvp-one-season-reset/ is deleted at merge."

risks:
  - "Feed blocked from GitHub runners (bot protection). Mitigation: browser UA; fallback local run."
  - "Feed shape differs from assumption (no group key, picks absent from descriptions). Mitigation: parser built only after capture; corrections file absorbs gaps."
  - "Opening roster/pick inventory drafted from model knowledge may be wrong. Mitigation: verified:false flags; user confirms before PR is called ready."
  - "Two-way/10-day/Exhibit-10 semantics in the feed may be lumpy. Mitigation: kind mapping table in parse.py with loud failure for unknowns."

model_routing_notes:
  - "Provider map verified 2026-09-07. Agent tool exposes model=haiku|sonnet|opus; reasoning inherits from session."
  - "T3.2 is the only frontier-tier implementation task (high uncertainty × high consequence)."

open_questions:
  - "Feed reachability from CI (resolved by first run)."
  - "Who verifies the curated snapshot rows (user)."

review:
  status: revised
  loop_count: 1
  notes:
    - "plan-reviewer-1: changes requested; all four blocking edits applied (drop baseline table, shared timeline helper + sort key, derive source selection + insert order, swap-rights parser exception) plus tertiary fetch fallback and T3.1 relabel."

checkpoint:
  required_before_execution: true
  status: approved (B0-B4 2026-09-17; B5 2026-09-18); B6 approved 2026-09-18; B7 approved 2026-09-21 (owner answered the four layout questions)
