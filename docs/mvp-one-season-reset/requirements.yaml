# Contract: durable task-definition handoff created by $work when the selected mode needs explicit requirements

artifact: requirements
feature: "mvp-one-season-reset"
mode: "large-initiative"
status: ready
owner_skill: work

summary:
  problem: "The current repo is an over-engineered 10-year, 21-table, multi-scraper lineage system that is hard to troubleshoot and prove correct."
  motivation: "A one-season scope (2025-26 opening night through today) with a pinned minimal data model is small enough to verify by hand and can grow later."
  requested_outcome: "Delete the existing implementation and build a simple, working, deterministic pipeline: fetch Memphis transactions from one machine-readable source, store raw + derived truth in a fresh minimal Supabase schema, validate it, and emit a graph JSON plus an SVG."

goals:
  - "Wipe the repo to the framework skeleton (.agents/, .claude/, CLAUDE.md, AGENTS.md, README.md, LICENSE, .gitignore, .python-version) and rebuild from scratch."
  - "Pin a minimal data model (target: 6 tables) in a fresh `lineage` schema in the existing Supabase project; drop the old `foundation` schema after a backup."
  - "Ingest Memphis transactions for the window [2025-26 opening night, load date] from the NBA player-movement JSON feed, storing the raw payload verbatim with source URL and fetched_at."
  - "Derive transactions (nodes) and asset movements (strand segments) deterministically from raw payloads + one curated opening-night snapshot file (players + all Memphis-owned future picks) + one curated corrections file; a re-run over identical inputs produces identical output."
  - "Cover node kinds: trade, signing, waiver/release, two-way signing, two-way conversion, 10-day/Exhibit-10, 2026 draft selection."
  - "Cover assets: players (opening roster + anyone moving through a Memphis transaction) and draft picks Memphis owns for the future as of opening night, plus picks received in-window."
  - "Parse pick movements from trade description text with a strict grammar; unparseable text fails the load loudly; a checked-in corrections file can override/add rows."
  - "Provide a validation command enforcing graph invariants and a graph-JSON export plus a Python-generated SVG (no PNG, no extra rendering dependency)."
  - "Run the loader in GitHub Actions via workflow_dispatch only, using the existing DATABASE_URL secret; also runnable locally via a mise task."
  - "Python only (uv, pydantic, psycopg). No frontend page in this pass."

non_goals:
  - "Any Astro/TS frontend work (keep node/astro out of the skeleton for now)."
  - "Multi-season history, 10-year graph, narrative/chapter/editorial layers."
  - "Pick swap rights, trade exceptions, cash considerations as first-class strands (footnotes later)."
  - "G League assignments/recalls as graph nodes."
  - "Full future pick inventory of other teams; picks Memphis traded away before opening night."
  - "Scheduled/automatic CI runs; scrapers of HTML sites; multi-source reconciliation."
  - "Safe-refresh/approval tooling, snapshot/restore machinery from the old repo."

constraints:
  technical:
    - "This sandbox cannot reach any NBA data host (egress policy denies stats.nba.com, nba.com, basketball-reference, etc.). Live fetches run only in GitHub Actions or on the user's machine; development here uses fixtures and reads loaded rows back through the Supabase MCP."
    - "The exact shape of the NBA player-movement feed must be confirmed from a real fetch (first CI run) before the parser is finalized."
    - "Dropping `foundation` is destructive and requires an explicit user go after a backup exists."
    - "Deterministic derive: derived tables are rebuilt in one transaction from inputs; no in-place manual edits to derived tables."
  product:
    - "Simple and working first; add complexity later. Prefer fewer tables/commands over generality."
    - "Every transaction row must be traceable to a raw source record."
  process:
    - "Follow .agents workflow: plan checkpoint before execution; PR before verification; docs/<feature>/ removed at merge."
    - "Feature branch is the session-pinned work/mvp."

assumptions:
  - "The NBA player-movement feed lists one row per player per transaction with a group key linking rows of the same trade, a transaction type, a date, team IDs, and a free-text description that mentions draft picks."
  - "Opening night 2025-26 for Memphis is on/around 2025-10-22; the exact date and roster come from the Grizzlies' official opening-night roster release, curated once by hand."
  - "Memphis-owned future picks as of opening night can be curated once by hand (~7 drafts × 2 rounds plus acquired picks)."
  - "GitHub-hosted runners can reach stats.nba.com with a browser-like User-Agent; if not, the fallback is running the same CLI locally."

repository_sync:
  source: "docs/mvp-one-season-reset/status.yaml"
  repositories_confirmed:
    - "/home/user/nba-asset-lineage (current, a42b0ba)"
  accepted_unverified_states: []

repo_context:
  relevant_paths:
    - ".agents/ (kept)"
    - ".github/workflows/db-keepalive.yml, db-backup.yml (schema-agnostic; keep)"
    - "everything else: deletion candidate"
  systems_in_scope:
    - "Supabase Postgres project referenced by DATABASE_URL"
    - "GitHub Actions"
  prior_artifacts:
    - "docs/frontend/visualization-*.md (conceptual node/strand model; will be deleted but is in git history on main)"
    - "configs/data/*.json curated fixtures (deleted; recoverable from main history)"

research:
  repo_findings:
    - "index.astro is already broken (imports non-existent visualization-graph.json); 20MB foundation-graph.json is committed."
    - "Only durable coexistence point in Supabase is the schema name `foundation`; db_config reads DATABASE_URL only."
    - "Both GitHub workflows are schema-agnostic and survive a schema wipe."
    - "Old live_sources.py used https://stats.nba.com/js/data/playermovement/NBA_Player_Movement.json — the only JSON API among candidate sources."
  platform_findings:
    - "All nine candidate data hosts are egress-blocked from this sandbox (proxy policy denial)."
    - "Basketball-Reference MEM/2026_transactions.html is the recommended human reference of record; ProSportsTransactions best for waivers/10-days."

acceptance_criteria:
  - "Repo contains only: framework files, README/AGENTS/CLAUDE rewritten for the MVP, pyproject/uv.lock/mise.toml, src/lineage/, sql/, data/, tests/, .github/workflows/."
  - "`sql/` defines the `lineage` schema with <= 6 tables; applied to Supabase; `foundation` dropped after a stored backup."
  - "`lineage fetch` stores the feed payload as a source_record (idempotent by content hash)."
  - "`lineage derive` rebuilds transaction, asset, movement rows from source_record + data/*.json in one transaction; two consecutive runs yield identical row sets."
  - "`lineage validate` passes on the loaded data and fails on a fixture with a planted inconsistency."
  - "`lineage export` writes graph.json (nodes + strands) and `lineage render` writes graph.svg from it."
  - "Offline pytest suite covers parser, pick grammar, corrections, derive determinism, validate, export, render."
  - "GitHub workflow `lineage-load.yml` (workflow_dispatch) runs fetch → derive → validate → export and uploads graph.json/graph.svg as artifacts."

open_questions:
  - "Curated snapshot: orchestrator drafts from knowledge with verified:false flags; user verifies each row (decided)."
  - "Does stats.nba.com respond from GitHub-hosted runners? Verified only by the first workflow run."

ready_for_planning: true
planning_blockers: []
