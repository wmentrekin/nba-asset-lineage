summary:
  scope_executed: >
    Investigated why the existing 3-day Supabase keepalive still triggered a
    free-tier inactivity pause warning, what the 5-7 connections on the
    dashboard represent, and free-tier backup options. Implemented the two
    fixes the user approved: db-keepalive.yml cron tightened from every 3
    days to daily, and a new db-backup.yml added that runs a weekly
    `supabase db dump` via the session pooler (derived from the existing
    DATABASE_URL secret) and uploads the dump as a 90-day-retention GitHub
    Actions artifact.
  outcome: >
    Both changes made on work/supabase-free-tier-audit; YAML validated
    locally. Not yet run in Actions (needs a workflow_dispatch or the first
    scheduled fire to confirm end-to-end -- the session-pooler port swap on
    DATABASE_URL is unverified against the live database, similar to how the
    original keepalive needed a pooler-host fix in PR #5).

